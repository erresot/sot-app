<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descrição Cirúrgica</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--tx:#1b2430;--mut:#5d6b7c;--bd:#d5dde6;--ac:#0f6cbd;--ac2:#e3effa;--warn:#b54708;--warnbg:#fff4e5;--err:#b42318;--errbg:#fef3f2;--ok:#1a7f37;--chip:#f1f4f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--card:#18202a;--tx:#e6edf3;--mut:#93a1b2;--bd:#2c3846;--ac:#4ea1ff;--ac2:#1c2d40;--warn:#ffb86b;--warnbg:#3a2a14;--err:#ff8a80;--errbg:#3b1d1b;--ok:#4ac26b;--chip:#222c38}}
:root[data-theme="dark"]{--bg:#0f141a;--card:#18202a;--tx:#e6edf3;--mut:#93a1b2;--bd:#2c3846;--ac:#4ea1ff;--ac2:#1c2d40;--warn:#ffb86b;--warnbg:#3a2a14;--err:#ff8a80;--errbg:#3b1d1b;--ok:#4ac26b;--chip:#222c38}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
header h1 span{color:var(--ac)}
.sel{display:flex;gap:6px;flex:1 1 520px;flex-wrap:wrap}
.sel select,.sel input{flex:1 1 160px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:7px 8px;width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:7px;padding:7px 11px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.sm{padding:4px 9px;font-size:13px}
button:hover{filter:brightness(.97)}
main{display:flex;gap:12px;padding:12px;align-items:flex-start}
#form{flex:1 1 52%;min-width:0}
#out{flex:1 1 48%;min-width:0;position:sticky;top:64px;max-height:calc(100vh - 76px);overflow:auto}
fieldset{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:0 0 12px;padding:10px 12px 12px}
legend{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ac);padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:3px}
.fld .req{color:var(--warn)}
.fld input.other{margin-top:4px}
.hid{display:none!important}
.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--bd);border-radius:20px;padding:5px 10px;font-size:13px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.step{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--bd)}
.step:last-child{border-bottom:0}
.step input{width:auto;margin-top:3px;flex:0 0 auto}
.step.off span{opacity:.45;text-decoration:line-through}
.step span{font-size:14px;line-height:1.35}
.step b{color:var(--ac);font-weight:600}
.hint{font-size:12px;color:var(--mut);margin:4px 0 0}
#texto{min-height:55vh;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.45;resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.badge{font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px}
.badge.pend{background:var(--warnbg);color:var(--warn)}
.badge.err{background:var(--errbg);color:var(--err)}
.badge.ok{background:var(--ac2);color:var(--ok)}
#manualMsg{background:var(--warnbg);color:var(--warn);font-size:13px;border-radius:7px;padding:6px 9px;margin-bottom:8px}
#res{position:absolute;z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:50vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:280px}
#res div{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:14px}
#res div:hover{background:var(--ac2)}
#res small{color:var(--mut)}
.srch{position:relative;flex:1 1 200px}
.sig{font-size:12px;color:var(--mut);margin:-2px 0 8px}
.tabs{display:none}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:520px;width:92vw}
dialog li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
dialog ul{list-style:none;padding:0;margin:8px 0}
#printOut{display:none}
/* caso com vários procedimentos */
#caseBar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.pchip{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 6px 4px 11px;font-size:13px;cursor:pointer;max-width:100%}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:280px}
.pchip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.pchip .x{border:0;background:transparent;color:inherit;padding:0 5px;font-size:14px}
/* linhas de tabela (OPME, material, explante) */
.oprow,.ophead{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) 64px minmax(0,1fr) auto auto;gap:6px;align-items:center}
.oprow{padding:6px 0;border-bottom:1px dashed var(--bd)}
.ophead{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.oprow .optxt{grid-column:1/-1}
.oprow button{padding:6px 9px}
.mrow,.mhead{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.8fr) 64px minmax(0,1.2fr) auto;gap:6px;align-items:center}
.mrow{padding:6px 0;border-bottom:1px dashed var(--bd)}
.mhead{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.opbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;margin-top:8px}
.opbar .srch{flex:1 1 240px}
#opRes{position:absolute;z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:45vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18);left:0;right:0}
#opRes div{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:13px}
#opRes div:hover{background:var(--ac2)}
#opRes small{color:var(--mut)}
.opempty{font-size:13px;color:var(--mut);padding:6px 0}
.nvg{border:1px dashed var(--bd);border-radius:8px;padding:8px;margin-bottom:8px}
.nvg h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:auto}
/* verificação */
#checks{margin-bottom:8px}
#checks .ck{font-size:13px;border-radius:7px;padding:6px 9px;margin-bottom:4px;display:flex;gap:6px}
#checks .ck.erro{background:var(--errbg);color:var(--err)}
#checks .ck.alerta{background:var(--warnbg);color:var(--warn)}
#checks .ck.ok{background:var(--ac2);color:var(--ok)}
#checks summary{cursor:pointer;font-size:13px;font-weight:700;margin-bottom:6px}
@media (max-width:700px){.oprow{grid-template-columns:1fr 64px 44px 44px}.oprow>select:first-child{grid-column:1/-1}.oprow>[data-op=q]{grid-column:2/-1}.oprow>[data-op=l]{grid-column:1/3}.ophead,.mhead{display:none}.mrow{grid-template-columns:1fr 64px 44px}.mrow>input:first-child,.mrow>input:nth-child(2){grid-column:1/-1}}
@media (max-width:900px){
 main{display:block;padding:8px}
 #out{position:static;max-height:none}
 .tabs{display:flex;gap:6px;width:100%}
 .tabs button{flex:1}
 .tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
 body.vtexto #form{display:none}
 body:not(.vtexto) #out{display:none}
 header h1{font-size:15px}
 .grid{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}#printOut,#printOut *{visibility:visible}#printOut{display:block;position:absolute;left:0;top:0;white-space:pre-wrap;font:12pt/1.45 Arial,sans-serif;color:#000;padding:1.5cm}}
</style>
</head>
<body>
<header>
 <h1><span>OrthoHub</span> · Descrição cirúrgica</h1>
 <div class="sel">
  <select id="seg" aria-label="Segmento"></select>
  <select id="proc" aria-label="Procedimento"></select>
  <div class="srch"><input id="busca" placeholder="🔎 Buscar procedimento…" autocomplete="off"><div id="res" class="hid"></div></div>
 </div>
 <div class="tabs"><button id="tbF" class="on">Formulário</button><button id="tbT">Texto <span id="tbBadge"></span></button></div>
</header>
<main>
 <section id="form"></section>
 <section id="out">
  <div class="bar">
   <button class="pri" id="bCopiar">Copiar</button>
   <button id="bTxt">Baixar .txt</button>
   <button id="bPrint">Imprimir</button>
   <button id="bSalvar">Salvar rascunho</button>
   <button id="bAbrir">Rascunhos</button>
   <button id="bNovo">Novo caso</button>
   <label class="chk"><input type="checkbox" id="upper"> MAIÚSCULAS</label>
   <span id="badge" class="badge"></span>
  </div>
  <details id="checks" open><summary>Verificação de coerência</summary><div id="ckList"></div></details>
  <div id="manualMsg" class="hid">Texto editado manualmente — mudanças no formulário não serão aplicadas. <button id="bRegen">Regenerar</button></div>
  <textarea id="texto" spellcheck="false"></textarea>
  <p class="hint">“____” = campo pendente. O texto é um modelo: confira se descreve exatamente o que foi feito antes de assinar.</p>
 </section>
</main>
<dialog id="dlg"><h3 style="margin:4px 0">Rascunhos salvos neste navegador</h3><ul id="dlgList"></ul><button id="dlgFechar">Fechar</button></dialog>
<dialog id="dlgAsk"><p id="askMsg" style="margin:6px 0 14px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button id="askNao">Cancelar</button><button class="pri" id="askSim">Confirmar</button></div></dialog>
<div id="printOut"></div>

 if(S.mat.length)S.matNone=false;

 if(!OPT_CACHE){let h="",g="";OPME.forEach(it=>{const gg=it.c+" · "+it.s;if(gg!==g){if(g)h+="</optgroup>";h+=`<optgroup label="${esc(gg)}">`;g=gg}h+=`<option value="${it.id}">${esc(it.n)}</option>`});OPT_CACHE=h+"</optgroup>"}
 return `<option value="">— material —</option>`+OPT_CACHE.replace(`value="${sel}"`,`value="${sel}" selected`);
}
function opLine(r){const it=OPI[r.i];if(!it)return "material ____";const v=r.v>=0?it.v[r.v]:null;let med;
 if(isGen(it)){const b=v&&v!=="preencher"?v:"";med=[b,r.t].filter(Boolean).join(", ")||"____"}else med=v==="unidade"?"":(v||"medida ____");
 return `${r.q||"____"} × ${it.n}${med?" – "+med:""}${r.l?" – lote "+r.l:""}`}
function opSide(r){const it=OPI[r.i];if(!it||r.v<0)return "";const v=norm(it.v[r.v]);return /\bdireit/.test(v)?"direito":/\besquerd/.test(v)?"esquerdo":""}

function valI(k,it){it=it||I();const p=byId(it.pid);let v;if(k==="lado")v=it.lado;else if(p.c[k])v=it.sp[k];else v=S.c[k];if(Array.isArray(v))v=v.join("; ");return isBlank(v)?"____":v}
const fillI=(s,it)=>s.replace(/\{(\w+)\}/g,(m,k)=>valI(k,it));
const limbLados=()=>S.items.map(it=>it.lado).filter(l=>l==="direito"||l==="esquerdo");

 if(/decúbito lateral/.test(v)&&!/decúbito lateral (direito|esquerdo)/.test(v)){const l=limbLados()[0];
  v=v.replace("decúbito lateral",l?`decúbito lateral ${l==="direito"?"esquerdo":"direito"} (lado ${l} para cima)`:"decúbito lateral ____");}
 return v}
function region(it){const p=byId(it.pid);let r=p.nv||SEGREG[p.seg]||"auto";
 if(r==="auto"){const t=norm(Object.values(it.sp).join(" ")+" "+p.n);r=/umero|antebraco|radio|ulna|punho|clavicula|cotovelo|braco|olecran|escapula|ombro/.test(t)?"ms":/\bmao\b|dedo|metacarp/.test(t)?"mao":/coluna|vertebr|lombar|cervical|torac/.test(t)?"col":"mi"}
 return r}

function nvLabel(g){return NVF[g.r].lb+(g.l&&g.l!=="não se aplica"?" "+(g.r==="mao"?(g.l==="direito"?"direita":g.l==="esquerdo"?"esquerda":g.l):g.l):"")}
function procLine(it,i){const p=byId(it.pid);const nome=p.custom?valI("nome",it):p.n;
 return `${S.items.length>1?(i+1)+". ":""}${nome} – lado ${valI("lado",it)}${p.c.class?". "+p.c.class.r+": "+valI("class",it):""}.`}

function buildText(){
 const L=[],D=[];let n=1;const add=s=>{if(s)D.push(`${n++}. ${cap(s).replace(/\.\.$/,".")}`)};
 if(S.dco.on){L.push("CIRURGIA DE CONTROLE DE DANOS (ESTÁGIO TEMPORÁRIO)");L.push(`Motivo: ${S.dco.mot.length?S.dco.mot.join("; "):"____"}. Programação: ${S.dco.plano||"____"}.`);L.push("")}
 L.push(S.items.length>1?"PROCEDIMENTOS REALIZADOS":"PROCEDIMENTO REALIZADO");
 S.items.forEach((it,i)=>L.push(procLine(it,i)));
 // OPME
 const anyOp=S.items.some(it=>it.op.length);
 if(anyOp){L.push("","OPME UTILIZADA");let k=1;S.items.forEach((it,i)=>{if(!it.op.length)return;if(S.items.length>1)L.push(`Procedimento ${i+1}:`);it.op.forEach(r=>L.push(`${k++}. ${opLine(r)}.`))});L.push(`Etiquetas: ${S.c.opme||"____"}.`)}
 // descrição
 L.push("","DESCRIÇÃO DO PROCEDIMENTO");
 add(`Paciente em ${posText()}, sob ${valI("anestesia")}, com proteção das proeminências ósseas.`);
 const allX=S.items.every(it=>byId(it.pid).x);
 if(!allX){add(valI("atb")+".");add(valI("antissepsia")+".");
  const ls=[...new Set(S.items.map(it=>valI("lado",it)))].join(" e ");add(`Time-out realizado com confirmação de identidade, procedimento(s) e lateralidade (${ls}).`);
  add(cap(valI("garrote"))+".")}
 S.items.forEach((it,i)=>{const p=byId(it.pid);
  if(S.items.length>1)add(`${i?"Em seguida, "+it.prep+", realizado o":"Realizado o"} procedimento ${i+1} – ${p.custom?valI("nome",it):p.n} (lado ${valI("lado",it)}):`);
  p.p.forEach((s,j)=>{if(it.st[j])add(fillI(s,it))});
  (it.ex||"").split("\n").map(x=>x.trim()).filter(Boolean).forEach(x=>add(x.replace(/\.?$/,".")));
  if(it.rx!==RX_NO)add((it.rx||"____")+".")});
 nvGroups().forEach(g=>{const vals=Object.keys(NVF[g.r].f).map(f=>S.nv[g.k+"|"+f]).filter(v=>v!=="não aplicável");const txt=vals.map(v=>isBlank(v)?"____":v).join("; ");add(`Ao final, ${nvLabel(g)}: ${txt}.`)});
 if(!allX){const gar=!/^sem garrote/.test(S.c.garrote||"")&&!isBlank(S.c.garrote);
  add(valI("hemostasia")+"."+(gar?" Tempo de garrote: "+valI("tgarrote")+" min.":""));add(valI("dreno")+".");add(valI("fechamento")+".");add(valI("curativo")+"; "+valI("imob")+".")}
 else add(valI("imob")+".");
 const semInt=/^sem intercorr/.test(S.c.intercorrencias||"");
 add(`Sangramento ${valI("sangramento")}. Intercorrências: ${valI("intercorrencias")}${semInt?"":" – "+valI("intdesc")}.`);

 if(S.mat.length)S.mat.forEach((r,i)=>L.push(`${i+1}. ${r.e||"exame ____"}: ${r.m||"material ____"}${r.n?" ("+r.n+(+r.n>1?" amostras":" amostra")+")":""}${r.l?" – "+r.l:""}.`));
 else L.push(S.matNone?"Não foi enviado material para exame.":"____");
 if(S.expl.length){L.push("","MATERIAL RETIRADO");S.expl.forEach((r,i)=>L.push(`${i+1}. ${r.q?r.q+" × ":""}${r.t||"____"}${r.d?" ("+r.d+")":""} – ${r.dest||"____"}.`))}

}

function checks(){const out=[];const E=m=>out.push(["erro",m]),A=m=>out.push(["alerta",m]);
 const multi=S.items.length>1;const pn=(it,i)=>multi?`Procedimento ${i+1} (${byId(it.pid).n})`:byId(it.pid).n;
 S.items.forEach((it,i)=>{const p=byId(it.pid);const r=region(it);
  if(isBlank(it.lado))E(`${pn(it,i)}: lateralidade não informada.`);
  if(it.lado==="bilateral")A(`${pn(it,i)}: lado “bilateral” — prefira um procedimento por lado (botão “+ Procedimento”), com OPME e etapas separadas.`);
  if(it.lado==="não se aplica"&&r!=="col")A(`${pn(it,i)}: procedimento de membro com lateralidade “não se aplica”.`);
  if(p.c.class&&isBlank(it.sp.class))A(`${pn(it,i)}: ${p.c.class.r.toLowerCase()} não informada.`);
  it.op.forEach(o=>{const sd=opSide(o);if(sd&&(it.lado==="direito"||it.lado==="esquerdo")&&sd!==it.lado)E(`${pn(it,i)}: OPME “${OPI[o.i].n}” é de lado ${sd} e o procedimento é ${it.lado}.`)});
  const pend=it.op.filter(o=>!OPI[o.i]||(o.v<0&&!(isGen(OPI[o.i])&&o.t))||(isGen(OPI[o.i])&&!o.t&&OPI[o.i].v[o.v]==="preencher")).length;
  if(pend)A(`${pn(it,i)}: ${pend} item(ns) de OPME sem medida/descrição.`);
  const hasImpl=it.op.some(o=>OPI[o.i]&&/Placas|Parafusos|Hastes|Fios|Fixador/.test(OPI[o.i].c));
  if(it.rx===RX_NO&&hasImpl)A(`${pn(it,i)}: há implantes na OPME, mas a radioscopia está como “não utilizada”.`);
  if(INFSET.has(p.id)&&!S.mat.some(m=>/cultura/.test(m.e||"")))E(`${pn(it,i)}: procedimento por infecção sem cultura registrada em “Material enviado para exame”.`);
  if(p.id==="biopsia_ossea"&&!S.mat.some(m=>/anatomo/.test(m.e||"")))E(`${pn(it,i)}: biópsia sem anatomopatológico registrado.`);
  if(EXPLD[p.id]&&!S.expl.length)A(`${pn(it,i)}: procedimento com retirada de material, mas “Material retirado” está vazio.`);
  if(DCOSET.has(p.id)&&!S.dco.on)A(`${pn(it,i)} costuma ser temporário — marque “Controle de danos” se for o caso.`);
  if(r==="ms"&&/coxa|tornozelo/.test(S.c.garrote||""))A(`${pn(it,i)}: garrote em membro inferior para procedimento de membro superior.`);
  if((r==="mi")&&/braço/.test(S.c.garrote||""))A(`${pn(it,i)}: garrote no braço para procedimento de membro inferior.`);
 });
 // duplicidade
 const seen={};S.items.forEach((it,i)=>{const k=it.pid+"|"+it.lado;if(seen[k]!==undefined)A(`Procedimentos ${seen[k]+1} e ${i+1} são iguais e do mesmo lado.`);else seen[k]=i});
 // decúbito
 const pos=S.c.posicao||"";const m=pos.match(/decúbito lateral (direito|esquerdo)/);const ll=[...new Set(limbLados())];
 if(m&&ll.length===1&&m[1]===ll[0])E(`Decúbito lateral ${m[1]} com procedimento do lado ${ll[0]} — o lado operado fica para cima (seria decúbito lateral ${ll[0]==="direito"?"esquerdo":"direito"}).`);
 if(/decúbito lateral/.test(pos)&&ll.length>1)A("Decúbito lateral com procedimentos em lados diferentes — descreva o reposicionamento.");
 // garrote / atb
 if(!/^sem garrote/.test(S.c.garrote||"")&&isBlank(S.c.tgarrote))A("Tempo de garrote não informado.");
 if(/postergado/.test(S.c.atb||"")&&!S.mat.some(m=>/cultura/.test(m.e||"")))A("Antibiótico postergado para culturas, mas nenhuma cultura registrada.");
 if(!/^sem intercorr/.test(S.c.intercorrencias||"")&&isBlank(S.c.intdesc))E("Intercorrência marcada sem descrição.");
 // seções
 if(isBlank(S.ach))A("Achados intraoperatórios não preenchidos.");
 if(!S.mat.length&&!S.matNone)A("Material enviado para exame: adicione os exames ou marque “nenhum material enviado”.");
 S.mat.forEach((r,i)=>{if(isBlank(r.e)||isBlank(r.m))A(`Material para exame ${i+1}: exame ou material não informado.`)});
 S.expl.forEach((r,i)=>{if(isBlank(r.t))A(`Material retirado ${i+1}: tipo não informado.`)});
 nvGroups().forEach(g=>{const miss=Object.keys(NVF[g.r].f).filter(f=>isBlank(S.nv[g.k+"|"+f])).length;if(miss)A(`Estado neurovascular (${nvLabel(g)}): ${miss} item(ns) não preenchido(s).`);
  Object.keys(NVF[g.r].f).forEach(f=>{const v=S.nv[g.k+"|"+f]||"";if(/descrever/.test(v))A(`Estado neurovascular (${nvLabel(g)}): “${v}” — detalhe em “Passos adicionais” ou na descrição.`)})});
 if(S.dco.on&&(!S.dco.mot.length||isBlank(S.dco.plano)))A("Controle de danos: informe o motivo e a programação do tratamento definitivo.");
 const anyOp=S.items.some(it=>it.op.length);if(anyOp&&/sem OPME/.test(S.c.opme||""))A("Há OPME listada, mas as etiquetas estão como “sem OPME”.");
 if(anyOp&&/pendente/.test(S.c.opme||""))A("Etiquetas de rastreabilidade da OPME ainda pendentes.");
 return out}

  if(out.length>40)break}
 r.innerHTML=out.length?out.slice(0,40).map(o=>`<div data-oi="${o[0]}" data-ov="${o[1]}">${esc(o[2])}<br><small>${esc(o[3])}</small></div>`).join(""):"<div><small>Nada encontrado — use “Outros › Material não listado”.</small></div>";

$("bNovo").onclick=()=>ask("Iniciar um novo caso? Os dados atuais serão descartados (salve um rascunho antes, se precisar).",novoCaso);
function novoCaso(){newCase(I().pid);manual=false;$("manualMsg").classList.add("hid");$("upper").checked=S.upper;renderAll()};
$("bSalvar").onclick=()=>{const st=store();st.drafts=st.drafts||[];const nome=S.items.map(it=>byId(it.pid).n+(it.lado?" ("+it.lado+")":"")).join(" + ");st.drafts.unshift({nome,ts:Date.now(),S:JSON.parse(JSON.stringify(S)),texto:manual?$("texto").value:null});st.drafts=st.drafts.slice(0,40);persist(st);flash("bSalvar","Salvo ✓")};
$("bAbrir").onclick=()=>{const l=store().drafts||[];$("dlgList").innerHTML=l.length?l.map((d,i)=>`<li><span>${esc(d.nome)}<br><small>${new Date(d.ts).toLocaleString("pt-BR")}</small></span><span><button data-load="${i}">Abrir</button> <button data-del="${i}">✕</button></span></li>`).join(""):"<li>Nenhum rascunho salvo.</li>";$("dlg").showModal()};
$("dlgList").addEventListener("click",e=>{const st=store(),l=st.drafts||[];
 if(e.target.dataset.load!==undefined){const d=l[+e.target.dataset.load];S=d.S;$("dlg").close();$("upper").checked=S.upper;manual=false;renderAll();if(d.texto){manual=true;$("texto").value=d.texto;$("manualMsg").classList.remove("hid");badge()}}
 if(e.target.dataset.del!==undefined){l.splice(+e.target.dataset.del,1);st.drafts=l;persist(st);$("bAbrir").onclick()}});
$("dlgFechar").onclick=()=>$("dlg").close();
$("tbF").onclick=()=>{document.body.classList.remove("vtexto");$("tbF").classList.add("on");$("tbT").classList.remove("on")};
$("tbT").onclick=()=>{document.body.classList.add("vtexto");$("tbT").classList.add("on");$("tbF").classList.remove("on")};
addEventListener("pagehide",()=>{if(S){const st=store();st.atual=S;persist(st)}});
let tSave;function save(){clearTimeout(tSave);tSave=setTimeout(()=>{const st=store();st.atual=S;persist(st)},300)}

/* ================== INÍCIO ================== */
let framed=false;try{framed=window.self!==window.top&&!window.top.location.href}catch(e){framed=true}   // SOT APP: dentro do próprio app (mesmo site) os botões continuam; só some em moldura de outro site
if(framed){$("bTxt").classList.add("hid");$("bPrint").classList.add("hid")}
(function(){const st=store();
 if(st.atual&&st.atual.v===3&&st.atual.items&&st.atual.items.every(it=>byId(it.pid)))S=st.atual;else newCase(ALL[0].id);
 $("upper").checked=S.upper;renderAll()})();

</script>
