<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Descrição Cirúrgica</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--tx:#1b2430;--mut:#5d6b7c;--bd:#d5dde6;--ac:#0f6cbd;--ac2:#e3effa;--warn:#b54708;--warnbg:#fff4e5;--ok:#1a7f37;--chip:#f1f4f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--card:#18202a;--tx:#e6edf3;--mut:#93a1b2;--bd:#2c3846;--ac:#4ea1ff;--ac2:#1c2d40;--warn:#ffb86b;--warnbg:#3a2a14;--ok:#4ac26b;--chip:#222c38}}
:root[data-theme="dark"]{--bg:#0f141a;--card:#18202a;--tx:#e6edf3;--mut:#93a1b2;--bd:#2c3846;--ac:#4ea1ff;--ac2:#1c2d40;--warn:#ffb86b;--warnbg:#3a2a14;--ok:#4ac26b;--chip:#222c38}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
header h1 span{color:var(--ac)}
.sel{display:flex;gap:6px;flex:1 1 520px;flex-wrap:wrap}
.sel select,.sel input{flex:1 1 160px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:7px 8px;width:100%}
select:focus,input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:7px;padding:7px 11px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:hover{filter:brightness(.97)}
main{display:flex;gap:12px;padding:12px;align-items:flex-start}
#form{flex:1 1 52%;min-width:0}
#out{flex:1 1 48%;min-width:0;position:sticky;top:64px}
fieldset{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:0 0 12px;padding:10px 12px 12px}
legend{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--ac);padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:3px}
.fld .req{color:var(--warn)}
.fld input.other{margin-top:4px}
.hid{display:none!important}
.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--bd);border-radius:20px;padding:5px 10px;font-size:13px}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.step{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-bottom:1px dashed var(--bd)}
.step:last-child{border-bottom:0}
.step input{width:auto;margin-top:3px;flex:0 0 auto}
.step.off span{opacity:.45;text-decoration:line-through}
.step span{font-size:14px;line-height:1.35}
.step b{color:var(--ac);font-weight:600}
.hint{font-size:12px;color:var(--mut);margin:4px 0 0}
#texto{min-height:62vh;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px;line-height:1.45;resize:vertical}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.badge{font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px}
.badge.pend{background:var(--warnbg);color:var(--warn)}
.badge.ok{background:var(--ac2);color:var(--ok)}
#manualMsg{background:var(--warnbg);color:var(--warn);font-size:13px;border-radius:7px;padding:6px 9px;margin-bottom:8px}
#res{position:absolute;z-index:30;background:var(--card);border:1px solid var(--bd);border-radius:8px;max-height:50vh;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:280px}
#res div{padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--bd);font-size:14px}
#res div:hover{background:var(--ac2)}
#res small{color:var(--mut)}
.srch{position:relative;flex:1 1 200px}
.sig{font-size:12px;color:var(--mut);margin:-2px 0 8px}
.tabs{display:none}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:520px;width:92vw}
dialog li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
dialog ul{list-style:none;padding:0;margin:8px 0}
#printOut{display:none}
@media (max-width:900px){
 main{display:block;padding:8px}
 #out{position:static}
 .tabs{display:flex;gap:6px;width:100%}
 .tabs button{flex:1}
 .tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
 body.vtexto #form{display:none}
 body:not(.vtexto) #out{display:none}
 header h1{font-size:15px}
 .grid{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}#printOut,#printOut *{visibility:visible}#printOut{display:block;position:absolute;left:0;top:0;white-space:pre-wrap;font:12pt/1.45 Arial,sans-serif;color:#000;padding:1.5cm}}
</style>
</head>
<body>
<header>
 <h1><span>OrthoHub</span> · Descrição cirúrgica</h1>
 <div class="sel">
  <select id="seg" aria-label="Segmento"></select>
  <select id="proc" aria-label="Procedimento"></select>
  <div class="srch"><input id="busca" placeholder="🔎 Buscar procedimento…" autocomplete="off"><div id="res" class="hid"></div></div>
 </div>
 <div class="tabs"><button id="tbF" class="on">Formulário</button><button id="tbT">Texto <span id="tbBadge"></span></button></div>
</header>
<main>
 <section id="form"></section>
 <section id="out">
  <div class="bar">
   <button class="pri" id="bCopiar">Copiar</button>
   <button id="bTxt">Baixar .txt</button>
   <button id="bPrint">Imprimir</button>
   <button id="bSalvar">Salvar rascunho</button>
   <button id="bAbrir">Rascunhos</button>
   <button id="bNovo">Limpar caso</button>
   <span id="badge" class="badge"></span>
  </div>
  <div id="manualMsg" class="hid">Texto editado manualmente — mudanças no formulário não serão aplicadas. <button id="bRegen">Regenerar</button></div>
  <textarea id="texto" spellcheck="true"></textarea>
  <p class="hint">“____” = campo pendente. O texto é um modelo: confira se descreve exatamente o que foi feito antes de assinar.</p>
 </section>
</main>
<dialog id="dlg"><h3 style="margin:4px 0">Rascunhos salvos neste navegador</h3><ul id="dlgList"></ul><button id="dlgFechar">Fechar</button></dialog>
<div id="printOut"></div>

/* ================== ESTADO ================== */
const BLANK=new Set(["class","med","lado","dedo","qual","niveis","zona","nivel"]);
const SKEY="orthohub_descricao_v1";
let S={c:{},sp:{},st:{},ex:{},seg:Object.keys(DB)[0],pid:null};
let manual=false;
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const ALL=[];Object.entries(DB).forEach(([sg,l])=>l.forEach(p=>ALL.push({...p,seg:sg})));
const byId=id=>ALL.find(p=>p.id===id);
// garante que os padrões dos procedimentos existam nas listas comuns
ALL.forEach(p=>Object.entries(p.d||{}).forEach(([k,v])=>{const d=COMUNS[k];if(d&&d.o&&typeof v==="string"&&!d.o.includes(v))d.o.push(v)}));

function store(){try{return JSON.parse(localStorage.getItem(SKEY)||"{}")}catch(e){return{}}}
function persist(o){try{localStorage.setItem(SKEY,JSON.stringify(o))}catch(e){}}

function defC(k,d){if(d.t==="multi")return [...ORI_STD];if(d.t||BLANK.has(k)||d.req)return "";return d.o?d.o[0]:""}
function defS(k,d){if(d.v!==undefined)return d.v;if(d.t||BLANK.has(k))return "";return d.o?d.o[0]:""}
const BASE={};for(const[k,d]of Object.entries(COMUNS))if(d.g!==1)BASE[k]=defC(k,d);
function initCommon(){for(const[k,d]of Object.entries(COMUNS))if(S.c[k]===undefined)S.c[k]=defC(k,d)}
function P(){return byId(S.pid)}
function selectProc(id,applyDefaults=true){
 S.pid=id;const p=P();S.seg=p.seg;
 if(!S.sp[id]){S.sp[id]={};for(const[k,d]of Object.entries(p.c))S.sp[id][k]=defS(k,d)}
 if(!S.st[id])S.st[id]=p.p.map(()=>true);
 if(applyDefaults){for(const[k,v]of Object.entries(BASE))S.c[k]=Array.isArray(v)?[...v]:v;for(const[k,v]of Object.entries(p.d||{}))S.c[k]=Array.isArray(v)?[...v]:v}
 manual=false;renderHeader();renderForm();gen();save();
}

/* ================== RENDER ================== */
function renderHeader(){
 $("seg").innerHTML=Object.keys(DB).map(s=>`<option ${s===S.seg?"selected":""}>${esc(s)}</option>`).join("");
 $("proc").innerHTML=DB[S.seg].map(p=>`<option value="${p.id}" ${p.id===S.pid?"selected":""}>${esc(p.n)}</option>`).join("");
}
function field(k,d,v,scope){
 const lab=`${esc(d.r)}${d.req?' <span class="req">*</span>':""}`;const w=d.w?" wide":"";
 if(d.t==="multi"){return `<div class="fld wide"><label>${lab}</label><div class="chips">${d.o.map(o=>`<button type="button" class="chip ${(v||[]).includes(o)?"on":""}" data-k="${k}" data-sc="${scope}" data-chip="${esc(o)}">${esc(o)}</button>`).join("")}</div><input class="other" data-k="${k}" data-sc="${scope}" data-role="extra" placeholder="+ outra orientação (Enter)"></div>`}
 if(d.t)return `<div class="fld${w}"><label>${lab}</label><input type="${d.t}" data-k="${k}" data-sc="${scope}" data-role="plain" value="${esc(v)}"></div>`;
 const other=v!==""&&!d.o.includes(v);
 const blankOpt=(BLANK.has(k)||d.req)?`<option value="" ${v===""?"selected":""}>— selecione —</option>`:"";
 return `<div class="fld${w}"><label>${lab}</label><select data-k="${k}" data-sc="${scope}" data-role="sel">${blankOpt}${d.o.map(o=>`<option value="${esc(o)}" ${o===v?"selected":""}>${esc(o)}</option>`).join("")}<option value="__o" ${other?"selected":""}>✎ Outro / editar texto…</option></select><input class="other ${other?"":"hid"}" data-k="${k}" data-sc="${scope}" data-role="other" value="${other?esc(v):""}" placeholder="Digite o texto"></div>`;
}
function grp(title,keys){return `<fieldset><legend>${title}</legend><div class="grid">${keys.map(k=>field(k,COMUNS[k],S.c[k],"c")).join("")}</div></fieldset>`}
function renderForm(){
 const p=P();const sp=S.sp[p.id];
 const keys=k=>Object.keys(COMUNS).filter(x=>COMUNS[x].g===k);
 let h=`<fieldset><legend>1 · ${esc(p.n)}</legend><p class="sig">SIGTAP: ${esc(p.custom?"conforme preenchido":p.s)}</p><div class="grid">${field("lado",COMUNS.lado,S.c.lado,"c")}${Object.entries(p.c).map(([k,d])=>field(k,d,sp[k],"s")).join("")}</div></fieldset>`;
 h+=grp("2 · Anestesia e preparo",keys(2));
 h+=`<fieldset><legend>3 · Tempos cirúrgicos</legend><div id="steps"></div><div class="fld wide" style="margin-top:8px"><label>Passos adicionais (um por linha)</label><textarea id="extra" rows="3" placeholder="Ex.: Biópsia de fragmento para anatomopatológico.">${esc(S.ex[p.id]||"")}</textarea></div><p class="hint">Desmarque o que não se aplica ao caso.</p></fieldset>`;
 h+=grp("4 · Fechamento e pós-operatório",keys(3));
 $("form").innerHTML=h;renderSteps();
}
function renderSteps(){
 const p=P();const st=S.st[p.id];
 $("steps").innerHTML=p.p.map((s,i)=>`<label class="step ${st[i]?"":"off"}"><input type="checkbox" data-step="${i}" ${st[i]?"checked":""}><span>${s.replace(/\{(\w+)\}/g,(m,k)=>"<b>"+esc(val(k))+"</b>")}</span></label>`).join("");
}

/* ================== GERAÇÃO DO TEXTO ================== */
function raw(k){const p=P();if(p.c[k])return S.sp[p.id][k];return S.c[k]}
function val(k){let v=raw(k);if(Array.isArray(v))v=v.join("; ");return (v===undefined||v===null||String(v).trim()==="")?"____":v}
const fill=s=>s.replace(/\{(\w+)\}/g,(m,k)=>val(k));
function gen(){
 if(manual)return;
 const p=P(),L=[],D=[];let n=1;const add=s=>{if(s)D.push(`${n++}. ${cap(fill(s)).replace(/\.\.$/,".")}`)};
 const nome=p.custom?val("nome"):p.n, sig=p.custom?val("sig"):p.s;
 L.push(`Procedimento realizado: ${nome} – lado ${val("lado")} (SIGTAP ${sig}).`);
 if(p.c.imp)L.push(fill("Implante / OPME: {imp}")+(p.c.med?fill(" – {med}"):"")+fill(". Etiquetas/lotes: {opme}."));
 if(p.c.class)L.push(fill("Classificação: {class}."));
 L.push("","DESCRIÇÃO DO PROCEDIMENTO");
 add("Paciente em {posicao}, sob {anestesia}, com proteção das proeminências ósseas.");
 if(!p.x){add("{atb}.");add("{antissepsia}.");add("Time-out realizado com confirmação de identidade, procedimento e lateralidade ({lado}).");add(cap(val("garrote"))+".")}
 p.p.forEach((s,i)=>{if(S.st[p.id][i])add(s)});
 (S.ex[p.id]||"").split("\n").map(x=>x.trim()).filter(Boolean).forEach(x=>add(x.replace(/\.?$/,".")));
 if(val("rx")!=="radioscopia não utilizada")add("{rx}.");
 if(!p.x){
  const gar=!/^sem garrote/.test(val("garrote"))&&val("garrote")!=="____";
  add("{hemostasia}."+(gar?" Tempo de garrote: "+val("tgarrote")+" min.":""));
  add("{dreno}.");add("{fechamento}.");add("{curativo}; {imob}.");
 } else add("{imob}.");
 add("Sangramento {sangramento}. {intercorrencias}.".replace("{intercorrencias}",cap(val("intercorrencias"))));
 add("Paciente encaminhado à {destino}.");
 L.push(...D,"","ORIENTAÇÕES PÓS-OPERATÓRIAS");
 (raw("ori")||[]).forEach(o=>L.push("- "+cap(o)+"."));
 $("texto").value=L.join("\n");badge();
}
function fmtData(d){if(!d)return "____";const[a,m,dd]=d.split("-");return dd&&m&&a?`${dd}/${m}/${a}`:d}
function badge(){const n=($("texto").value.match(/____/g)||[]).length;const b=$("badge");b.className="badge "+(n?"pend":"ok");b.textContent=n?`${n} pendente(s)`:"✓ completo";$("tbBadge").textContent=n?`(${n})`:"✓"}

/* ================== EVENTOS ================== */
function setV(sc,k,v){if(sc==="c")S.c[k]=v;else S.sp[S.pid][k]=v;save()}
function changed(){renderSteps();gen()}
$("form").addEventListener("change",e=>{
 const t=e.target;
 if(t.dataset.step!==undefined){S.st[S.pid][+t.dataset.step]=t.checked;t.closest(".step").classList.toggle("off",!t.checked);gen();save();return}
 if(t.dataset.role==="sel"){const inp=t.closest(".fld").querySelector('[data-role="other"]');
  if(t.value==="__o"){inp.classList.remove("hid");if(!inp.value)inp.value=raw(t.dataset.k)||"";inp.focus();setV(t.dataset.sc,t.dataset.k,inp.value)}
  else{inp.classList.add("hid");setV(t.dataset.sc,t.dataset.k,t.value)}changed()}
});
$("form").addEventListener("input",e=>{
 const t=e.target;
 if(t.id==="extra"){S.ex[S.pid]=t.value;gen();save();return}
 if(t.dataset.role==="other"||t.dataset.role==="plain"){setV(t.dataset.sc,t.dataset.k,t.value);changed()}
});
$("form").addEventListener("click",e=>{
 const t=e.target.closest("[data-chip]");if(!t)return;
 const k=t.dataset.k,o=t.dataset.chip;let a=[...(S.c[k]||[])];
 a=a.includes(o)?a.filter(x=>x!==o):[...a,o];
 const ord=COMUNS[k].o;a.sort((x,y)=>{const i=ord.indexOf(x),j=ord.indexOf(y);return (i<0?999:i)-(j<0?999:j)});
 S.c[k]=a;t.classList.toggle("on");gen();save();
});
$("form").addEventListener("keydown",e=>{
 const t=e.target;if(t.dataset.role!=="extra"||e.key!=="Enter")return;e.preventDefault();
 const v=t.value.trim();if(!v)return;const k=t.dataset.k;
 if(!COMUNS[k].o.includes(v))COMUNS[k].o.push(v);S.c[k]=[...(S.c[k]||[]),v];renderForm();gen();save();
});
$("seg").onchange=()=>{S.seg=$("seg").value;selectProc(DB[S.seg][0].id)};
$("proc").onchange=()=>selectProc($("proc").value);
$("texto").addEventListener("input",()=>{manual=true;$("manualMsg").classList.remove("hid");badge()});
$("bRegen").onclick=()=>{manual=false;$("manualMsg").classList.add("hid");gen()};

// busca
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
$("busca").addEventListener("input",()=>{
 const q=norm($("busca").value.trim());const r=$("res");
 if(!q){r.classList.add("hid");return}
 const m=ALL.filter(p=>norm(p.n+" "+p.seg+" "+p.s).includes(q)).slice(0,15);
 r.innerHTML=m.length?m.map(p=>`<div data-id="${p.id}">${esc(p.n)}<br><small>${esc(p.seg)} · ${esc(p.s)}</small></div>`).join(""):"<div><small>Nada encontrado — use “Personalizado”.</small></div>";
 r.classList.remove("hid");
});
$("res").addEventListener("click",e=>{const d=e.target.closest("[data-id]");if(!d)return;$("res").classList.add("hid");$("busca").value="";selectProc(d.dataset.id)});
document.addEventListener("click",e=>{if(!e.target.closest(".srch"))$("res").classList.add("hid")});

// ações
function copiar(){const t=$("texto").value;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();function ok(){flash("bCopiar","Copiado ✓")}function fb(){$("texto").select();try{document.execCommand("copy");ok()}catch(e){alert("Selecione e copie manualmente.")}}}
function flash(id,txt){const b=$(id),o=b.textContent;b.textContent=txt;setTimeout(()=>b.textContent=o,1400)}
$("bCopiar").onclick=copiar;
$("bTxt").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("texto").value],{type:"text/plain;charset=utf-8"}));a.download=`descricao_${S.pid}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
$("bPrint").onclick=()=>{$("printOut").textContent=$("texto").value;window.print()};
$("bNovo").onclick=()=>{if(!confirm("Restaurar os padrões deste procedimento (lado, classificação, medidas e escolhas)?"))return;delete S.sp[S.pid];delete S.st[S.pid];delete S.ex[S.pid];S.c.lado="";S.c.tgarrote="";selectProc(S.pid);manual=false;$("manualMsg").classList.add("hid");renderForm();gen();save()};
$("bSalvar").onclick=()=>{const st=store();st.drafts=st.drafts||[];const nome=`${P().n} · lado ${S.c.lado||"?"}`;st.drafts.unshift({nome,ts:Date.now(),S:JSON.parse(JSON.stringify(S)),texto:manual?$("texto").value:null});st.drafts=st.drafts.slice(0,40);persist(st);flash("bSalvar","Salvo ✓")};
$("bAbrir").onclick=()=>{const st=store(),l=st.drafts||[];$("dlgList").innerHTML=l.length?l.map((d,i)=>`<li><span>${esc(d.nome)}<br><small>${new Date(d.ts).toLocaleString("pt-BR")}</small></span><span><button data-load="${i}">Abrir</button> <button data-del="${i}">✕</button></span></li>`).join(""):"<li>Nenhum rascunho salvo.</li>";$("dlg").showModal()};
$("dlgList").addEventListener("click",e=>{const st=store();const l=st.drafts||[];
 if(e.target.dataset.load!==undefined){const d=l[+e.target.dataset.load];S=d.S;initCommon();$("dlg").close();selectProc(S.pid,false);if(d.texto){manual=true;$("texto").value=d.texto;$("manualMsg").classList.remove("hid");badge()}}
 if(e.target.dataset.del!==undefined){l.splice(+e.target.dataset.del,1);st.drafts=l;persist(st);$("bAbrir").onclick()}});
$("dlgFechar").onclick=()=>$("dlg").close();
// abas (celular)
$("tbF").onclick=()=>{document.body.classList.remove("vtexto");$("tbF").classList.add("on");$("tbT").classList.remove("on")};
$("tbT").onclick=()=>{document.body.classList.add("vtexto");$("tbT").classList.add("on");$("tbF").classList.remove("on")};

let tSave;function save(){clearTimeout(tSave);tSave=setTimeout(()=>{const st=store();st.atual=S;persist(st)},300)}

/* ================== INÍCIO ================== */
(function(){
 const st=store();
 if(st.atual&&st.atual.pid&&byId(st.atual.pid)){S=st.atual;S.ex=S.ex||{};initCommon();selectProc(S.pid,false)}
 else{initCommon();selectProc(DB[S.seg][0].id)}
})();
</script>
</body>
