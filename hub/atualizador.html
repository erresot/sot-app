<head><script>/* SOT: esta página só abre depois da senha do app */(function(){var ok=false;try{ok=sessionStorage.getItem('sot-ok')==='1'&&Date.now()-(+localStorage.getItem('sot-ult')||0)<15*60000;}catch(e){}if(window.top===window&&!ok){location.replace(new URL('../index.html',location.href).href);return;}var u=0;function m(){var n=Date.now();if(n-u>20000){u=n;try{localStorage.setItem('sot-ult',String(n));}catch(e){}}}['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,m,{capture:true,passive:true});});})();</script>
<meta charset="UTF-8">

<style>
:root{--bg:#edf1f6;--card:#fff;--ink:#17233a;--mut:#5f6f86;--line:#d9e0ea;--acc:#1f6fce;--navy:#13365c;--ok:#1d8a5b;--ok2:#e4f4ec;--warn:#b7791f;--warn2:#fdf3e0;--bad:#c93636;--bad2:#fcebeb;--mono:ui-monospace,"SF Mono",Consolas,"Roboto Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:14px 12px 60px}
h1{font-size:19px;margin:0 0 4px}h2{font-size:15px;margin:18px 2px 8px;color:var(--navy)}
.hint{color:var(--mut);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{font-size:13px;color:var(--mut)}
select,input[type=date]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{font:600 13px/1 inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--acc)}button.sm{padding:5px 9px;font-size:12px}
.pac{border-left:4px solid var(--acc)}.pac h3{margin:0 0 6px;font-size:15px}.pac h3 small{color:var(--mut);font-weight:500}
.mud{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px dashed var(--line)}
.mud:first-of-type{border-top:0}.mud .de{font-family:var(--mono);font-size:12.5px;color:var(--mut);text-decoration:line-through}
.mud .para{font-family:var(--mono);font-size:13px;font-weight:600}.mud .por{font-size:12px;color:var(--mut)}
.mud.duv .para{color:var(--warn)}.mud.feito{opacity:.45}.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--warn2);color:var(--warn);margin-left:4px}
.tag.ok{background:var(--ok2);color:var(--ok)}.tag.bad{background:var(--bad2);color:var(--bad)}
.cab{font-family:var(--mono);font-size:14px;font-weight:600;background:var(--ok2);padding:8px 10px;border-radius:8px}
ul.lst{margin:6px 0 0;padding-left:18px}ul.lst li{margin:4px 0}.vazio{padding:20px;text-align:center;color:var(--mut)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.cmp>div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word}
.cmp .tit{font-family:inherit;font-weight:700;font-size:11.5px;color:var(--mut);background:none;border:0;padding:2px 2px 0}.cmp del{background:var(--bad2);color:var(--bad)}.cmp ins{text-decoration:none;background:#fff176;color:#111;font-weight:700}.cmp ins.duv{background:#ffcc80}
.resumo{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}.resumo b{color:var(--ink)}
html[data-theme="dark"]{--bg:#0f1517;--card:#182024;--ink:#e3ebe7;--mut:#93a39d;--line:#2a3539;--acc:#5aa2ff;--navy:#9cc3ff;--ok2:#163323;--ok:#5fd08f;--warn2:#33261a;--warn:#f0a35a;--bad2:#3b1d1a;--bad:#ff7b6e}
</style>

<body>
<h1>🔄 Atualizador de Internograma <span class="tag">protótipo</span></h1>
<div class="hint">Lê o internograma que o app já importou e mostra <b>só os números</b> que mudam hoje (DIH, dias de fratura/queda/déficit, PO, POI → 1 PO) e o cabeçalho já contado. Nada é alterado no Google Docs: você confere e corrige lá.</div>

<div class="card">
  <div class="row">
    <label>Atualizar para <input type="date" id="alvo"></label>
    <label>Os números do internograma estão em dia até
      <select id="ref"><option value="-1">ontem (antes da atualização de hoje)</option><option value="0">hoje (já atualizado)</option><option value="-2">anteontem</option></select></label>
    <button class="sec sm" id="recalc">Recalcular</button>
  </div>
  <div class="hint" id="fonte" style="margin-top:6px"></div>
</div>

<div id="saida"></div>

<script>
(function(){
'use strict';
var A = window.parent !== window ? window.parent : null;
try { if (A && A.document.documentElement.classList.contains('escuro')) document.documentElement.setAttribute('data-theme','dark'); } catch(e){}
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var FEITO = {}; try { FEITO = JSON.parse(sessionStorage.getItem('atualizador.feito') || '{}'); } catch(e){}
function salvaFeito(){ try { sessionStorage.setItem('atualizador.feito', JSON.stringify(FEITO)); } catch(e){} }
function iso(d){ return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function dm(d){ return ('0'+d.getDate()).slice(-2) + '/' + ('0'+(d.getMonth()+1)).slice(-2); }
function dmy(d){ return dm(d) + '/' + d.getFullYear(); }
function addD(d,n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }

if (!A || !A.S || !A.SOTCONT) { $('#saida').innerHTML = '<div class="card vazio">Abra este programa pelo OrthoHub do SOT APP (ele usa o internograma importado no app).</div>'; return; }
var C = A.SOTCONT, S = A.S;
$('#alvo').value = S.hoje || iso(new Date());

function linhasDe(t){ return String(t || '').split(/\n|\s+\/\s+/); }   // Doc: quebra de linha · PDF: " / "
// DIH: "Dih 12", "Di: 8", "DIH 1" na coluna do nome (linha própria)
var RX_DIH = /^(\s*(?:Dih|DIH|Di|DI|dih)\s*:?\s*)(\d{1,3})(\s*)$/;

function calcular(){
  var alvo = new Date($('#alvo').value + 'T00:00:00'), ref = addD(alvo, +$('#ref').value);
  var P = (S.pacientes || []).filter(function(p){ return !p.manual; });
  if (!P.length) { $('#saida').innerHTML = '<div class="card vazio">Nenhum internograma importado no app. Importe o de hoje em Ajustes e volte aqui.</div>'; return; }
  $('#fonte').textContent = 'Internograma importado no app' + (S.dataIG ? ' (cabeçalho diz ' + S.dataIG + ')' : '') + ' · ' + P.length + ' pacientes.';
  var lista = [], fazer = [], nMud = 0, nDuv = 0;
  P.forEach(function(p){
    var col = p.bruto || [], muds = [], quem = (p.leito || p.section || '—') + ' · ' + p.nome;
    // 1) DIH
    linhasDe(col[1]).forEach(function(l){
      var m = l.match(RX_DIH); if (!m) return;
      var n0 = +m[2], n, por, duv = false, dInt = null;
      if (p.dihData) dInt = A.parseData(p.dihData, alvo);
      else if (p.dihFonte === 'data' && p.dataSolta) dInt = A.parseData(p.dataSolta, alvo);
      if (dInt) { n = C.dias(dInt, alvo); por = 'pela data de internação (' + dm(dInt) + ')'; }
      else { n = n0 + C.dias(ref, alvo); por = 'sem data de internação: +' + C.dias(ref, alvo) + ' dia(s)'; duv = true; }
      if (n !== n0 && n >= 0) muds.push({ campo: 'DIH', de: l.trim(), para: (m[1] + n + m[3]).trim(), por: por, duv: duv });
    });
    // 2) Causa: contadores no começo de cada linha
    var LC = linhasDe(col[2]);
    LC.forEach(function(l, i){
      if (!l.trim()) return;
      var c0 = C.ler(l, ref); if (!c0) return;
      var comb = l;   // a data pode ter quebrado para a(s) linha(s) de baixo (PDF / célula estreita)
      if (!c0.d) for (var j = i + 1; j <= i + 2 && j < LC.length; j++) { if (C.ler(LC[j], ref)) break; comb += ' ' + LC[j]; }
      var r = C.atualizarTexto(comb, ref, alvo); if (!r.mudou.length) return;
      var x = r.mudou[0], para = x.para.slice(0, x.para.length - (comb.length - l.length)), c = C.ler(comb, ref) || {};
      muds.push({ campo: 'Causa', de: l.trim(), para: para.trim(), duv: !x.pelaData,
        por: x.pelaData ? 'pela data (' + (c.d ? dm(c.d) : '') + ')' : 'sem data na linha: +' + C.dias(ref, alvo) + ' dia(s) — confira' });
    });
    muds.forEach(function(x){ x.k = p.id + '|' + x.de; nMud++; if (x.duv) nDuv++; });
    // 3) coisas que só a pessoa resolve
    var txt0 = String(col[0] || '');
    if (/\d\s*Arquivo\b|^\s*Arquivo\s*$/m.test(txt0)) fazer.push({ q: quem, t: 'Chip “Arquivo” esquecido na coluna 1 — pode tirar.' });
    if (p.alta) fazer.push({ q: quem, t: 'Está na seção ALTAS (lista do plantonista da noite) — já saiu? Retirar do internograma.' });
    try { var po = A.progPosOp(p, alvo); if (po.alta && po.alta.dias === 0 && !p.alta) fazer.push({ q: quem, t: 'Programação: alta prevista hoje — passar para ALTAS quando liberada.' }); } catch(e){}
    try { var ex = A.pedidoExames(p, alvo); ex.pend.concat(ex.avisos).forEach(function(t){ fazer.push({ q: quem, t: '🧪 ' + t }); }); } catch(e){}
    lista.push({ p: p, quem: quem, muds: muds });
  });
  // cabeçalho
  var k = A.contagem ? A.contagem() : null, cab = '';
  if (k && k.c) cab = '(' + dmy(alvo) + ' - ' + k.c.hc + ' Hc / ' + k.c.ic + ' Ic / ' + k.c.hm + ' Hm' + (k.c.alta ? ' / ' + k.c.alta + ' Altas' : '') + ')';
  var h = '<div class="card"><div class="resumo"><span><b>' + nMud + '</b> números a mudar</span><span><b>' + nDuv + '</b> para conferir (sem data)</span><span><b>' + fazer.length + '</b> itens para você</span></div>' +
    '<div class="row" style="margin-top:8px"><button class="sm" id="copiaTudo">Copiar lista de correções</button><button class="sec sm" id="limpa">Desmarcar “feito”</button></div>' +
    '<div class="row" style="margin-top:10px"><button id="criaCopia">📄 Criar cópia atualizada no Drive</button><button class="sec" id="comparar">↔ Comparar lado a lado</button></div><div id="cmpBox"></div><div class="hint" id="copiaSt" style="margin-top:6px">Faz uma cópia idêntica do internograma e troca só os números na cópia (amarelo = pela data · laranja = confira). O internograma oficial não é alterado.</div></div>';
  if (cab) h += '<h2>Cabeçalho</h2><div class="card"><div class="cab" id="cabTxt">' + esc(cab) + '</div><div class="row" style="margin-top:8px"><button class="sm" data-copia="' + esc(cab) + '">Copiar</button>' +
    (S.dataIG && S.dataIG.indexOf(dm(alvo)) < 0 ? '<span class="tag">o cabeçalho atual diz ' + esc(S.dataIG) + '</span>' : '') + '</div><div class="hint">Contagem feita pelo app a partir das seções do internograma importado.</div></div>';
  if (fazer.length) h += '<h2>Para você resolver</h2><div class="card"><ul class="lst">' + fazer.map(function(x){ return '<li><b>' + esc(x.q) + '</b> — ' + esc(x.t) + '</li>'; }).join('') + '</ul></div>';
  h += '<h2>Números por paciente</h2>';
  var com = lista.filter(function(x){ return x.muds.length; });
  if (!com.length) h += '<div class="card vazio">Nenhum número a mudar ✓</div>';
  com.forEach(function(x){
    h += '<div class="card pac"><h3>' + esc(x.quem) + ' <small>' + x.muds.length + ' número(s)</small></h3>' + x.muds.map(function(m){
      var f = FEITO[m.k];
      return '<div class="mud' + (m.duv ? ' duv' : '') + (f ? ' feito' : '') + '"><input type="checkbox" data-feito="' + esc(m.k) + '"' + (f ? ' checked' : '') + ' title="Marcar como corrigido no internograma">' +
        '<div><div class="de">' + esc(m.de) + '</div><div class="para">' + esc(m.para) + (m.duv ? '<span class="tag">confira</span>' : '') + '</div><div class="por">' + m.campo + ' · ' + esc(m.por) + '</div></div>' +
        '<button class="sec sm" data-copia="' + esc(m.para) + '">Copiar</button></div>';
    }).join('') + '</div>';
  });
  var sem = lista.length - com.length;
  if (sem) h += '<div class="hint" style="margin:8px 2px">' + sem + ' paciente(s) sem número a mudar.</div>';
  $('#saida').innerHTML = h;
  window.__lista = { cab: cab, lista: com, fazer: fazer };
}
/* ---------- v68: comparar lado a lado (original × atualizado) ---------- */
function marca(de, para, duv){
  var k = 0; while (k < de.length && k < para.length && de[k] === para[k]) k++;
  var s = 0; while (s < de.length - k && s < para.length - k && de[de.length - 1 - s] === para[para.length - 1 - s]) s++;
  var a = esc(de.slice(0, k)), z = esc(de.slice(de.length - s));
  return { orig: a + '<del>' + esc(de.slice(k, de.length - s)) + '</del>' + z, novo: a + '<ins' + (duv ? ' class="duv"' : '') + '>' + esc(para.slice(k, para.length - s)) + '</ins>' + esc(para.slice(para.length - s)) };
}
function comparar(){
  var L = window.__lista, box = $('#cmpBox'); if (!L) return;
  if (box.innerHTML) { box.innerHTML = ''; return; }
  var CF = A.SOT_CONFIG || A.CFG || {}, docO = CF.DOC_ID ? 'https://docs.google.com/document/d/' + CF.DOC_ID + '/edit' : '', c = window.__copia;
  var h = '<div class="hint" style="margin-top:10px">Esquerda: internograma como está (<del style="background:var(--bad2);color:var(--bad)">número antigo</del>) · Direita: atualizado (<ins style="text-decoration:none;background:#fff176;color:#111">pela data</ins> · <ins style="text-decoration:none;background:#ffcc80;color:#111">confira</ins>).' +
    (docO ? ' <a href="' + esc(docO) + '" target="_blank" rel="noopener">Abrir o original</a>' : '') + (c ? ' · <a href="https://docs.google.com/document/d/' + esc(c.id) + '/edit" target="_blank" rel="noopener">Abrir a cópia atualizada</a>' : '') + '</div>';
  if (L.cab) h += '<div class="cmp"><div class="tit">Cabeçalho — original</div><div class="tit">Atualizado</div><div>' + esc(A.S.dataIG ? '(' + A.S.dataIG + ' …)' : '—') + '</div><div><ins>' + esc(L.cab) + '</ins></div></div>';
  L.lista.forEach(function(x){
    var o = [], n = [];
    x.muds.forEach(function(m){ var r = marca(m.de, m.para, m.duv); o.push(m.campo + ': ' + r.orig); n.push(m.campo + ': ' + r.novo); });
    h += '<div class="cmp"><div class="tit">' + esc(x.quem) + ' — original</div><div class="tit">Atualizado</div><div>' + o.join('\n') + '</div><div>' + n.join('\n') + '</div></div>';
  });
  box.innerHTML = h;
}
/* ---------- v68: cópia atualizada no Drive (Google Docs) ---------- */
var AMARELO = { red: 1, green: 0.95, blue: 0.46 }, LARANJA = { red: 1, green: 0.8, blue: 0.5 };
function paragrafos(conteudo, out, cel){   // todos os parágrafos, com o índice de cada caractere no documento
  (conteudo || []).forEach(function(se){
    if (se.paragraph) { var t = '', idx = []; (se.paragraph.elements || []).forEach(function(e){ var s = e.textRun ? e.textRun.content : new Array(Math.max(1, (e.endIndex - e.startIndex)) + 1).join('\uFFFC'); for (var i = 0; i < s.length; i++) idx.push(e.startIndex + i); t += s; }); out.push({ t: t, idx: idx, cel: cel }); }
    if (se.table) (se.table.tableRows || []).forEach(function(row, ri){ (row.tableCells || []).forEach(function(c, ci){ paragrafos(c.content, out, { tab: se.startIndex, r: ri, c: ci }); }); });
  });
  return out;
}
function edicao(P, de, para, cor){
  var off = P.t.indexOf(de); if (off < 0) return null;
  var k = 0; while (k < de.length && k < para.length && de[k] === para[k]) k++;
  var s = 0; while (s < de.length - k && s < para.length - k && de[de.length - 1 - s] === para[para.length - 1 - s]) s++;
  var velho = de.slice(k, de.length - s), novo = para.slice(k, para.length - s), ini = P.idx[off + k];
  if (ini == null) return null;
  return { ini: ini, velho: velho, novo: novo, cor: cor };
}
function montarPedidos(doc, L, cab){
  var Ps = paragrafos(doc.body && doc.body.content, [], null), eds = [], falta = [];
  var linhas = {};   // parágrafos por linha da tabela
  Ps.forEach(function(P){ if (P.cel) { var k = P.cel.tab + ':' + P.cel.r; (linhas[k] = linhas[k] || []).push(P); } });
  var linhaDe = function(p){
    var reg = String(p.registro || '').replace(/\D/g, ''), nome = String(p.nome || '').split(' ').slice(0, 2).join(' ').toUpperCase();
    var ks = Object.keys(linhas).filter(function(k){ var t1 = linhas[k].filter(function(P){ return P.cel.c === 1; }).map(function(P){ return P.t; }).join(' ');
      return reg.length >= 4 ? t1.replace(/\D+/g, ' ').split(' ').indexOf(reg) > -1 : (nome && t1.toUpperCase().replace(/\s+/g, ' ').indexOf(nome) > -1); });
    return ks.length === 1 ? linhas[ks[0]] : null;   // achou exatamente uma linha (nunca chuta entre duas)
  };
  L.lista.forEach(function(x){
    var row = linhaDe(x.p);
    x.muds.forEach(function(m){
      var col = m.campo === 'DIH' ? 1 : 2, e = null;
      if (row) { var cands = row.filter(function(P){ return P.cel.c === col && P.t.indexOf(m.de) > -1; }); if (cands.length === 1) e = edicao(cands[0], m.de, m.para, m.duv ? LARANJA : AMARELO); }
      if (e) eds.push(e); else falta.push(x.quem + ': ' + m.de + ' → ' + m.para);
    });
  });
  if (cab) { var Pc = Ps.filter(function(P){ return /\(\s*\d{1,2}\/?\d{1,2}\/\d{4}\s*-\s*\d+\s*hc\b[^)]*\)/i.test(P.t); })[0];
    if (Pc) { var mc = Pc.t.match(/\(\s*\d{1,2}\/?\d{1,2}\/\d{4}\s*-\s*\d+\s*hc\b[^)]*\)/i)[0]; var ec = edicao(Pc, mc, cab, AMARELO); if (ec) eds.push(ec); } else falta.push('Cabeçalho não encontrado: ' + cab); }
  eds.sort(function(a, b){ return b.ini - a.ini; });
  var req = [];
  eds.forEach(function(e){
    if (e.velho.length) req.push({ deleteContentRange: { range: { startIndex: e.ini, endIndex: e.ini + e.velho.length } } });
    if (e.novo.length) { req.push({ insertText: { location: { index: e.ini }, text: e.novo } });
      req.push({ updateTextStyle: { range: { startIndex: e.ini, endIndex: e.ini + e.novo.length }, textStyle: { backgroundColor: { color: { rgbColor: e.cor } } }, fields: 'backgroundColor' } }); }
  });
  return { req: req, n: eds.length, falta: falta };
}
function msgErro(e){
  var t = (e && (e.msg || e.message)) || String(e);
  if (/docs\.googleapis|Docs API has not been used|SERVICE_DISABLED|accessNotConfigured/i.test(t)) return 'A “Google Docs API” não está ligada no projeto do Google do app. É uma configuração única no console do Google (peça ao Claude o passo a passo). A cópia foi criada, mas os números não foram trocados.';
  if (e && e.auth) return 'O login do Google expirou: toque no ícone da nuvem no app, entre de novo e tente outra vez.';
  return 'Não deu certo: ' + t;
}
function criarCopia(btn){
  var L = window.__lista, st = $('#copiaSt'), Y = A.SYNC;
  if (!L) return;
  if (!Y || !Y.temToken()) { st.innerHTML = '<b>Entre no Google primeiro</b> (ícone da nuvem no topo do app) e toque de novo.'; return; }
  var alvo = new Date($('#alvo').value + 'T00:00:00'), nome = 'Internograma HCI — atualizado ' + dmy(alvo) + ' (cópia do app)', copia = null;
  btn.disabled = true; st.textContent = '1/3 Copiando o internograma…';
  Y.copiarInternograma(nome).then(function(f){ copia = f; st.textContent = '2/3 Lendo a cópia…'; return Y.docLer(f.id); })
   .then(function(doc){ var P = montarPedidos(doc, L, L.cab); st.textContent = '3/3 Trocando ' + P.n + ' números…';
      return (P.req.length ? Y.docAlterar(copia.id, P.req, doc.revisionId) : Promise.resolve()).then(function(){ return P; }); })
   .then(function(P){
      var link = copia.webViewLink || ('https://docs.google.com/document/d/' + copia.id + '/edit');
      st.innerHTML = '✅ <b>Cópia pronta:</b> <a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(nome) + '</a><br>' + P.n + ' número(s) trocado(s) e marcado(s) na cópia.' +
        (P.falta.length ? '<br>⚠ ' + P.falta.length + ' não encontrado(s) na cópia — troque à mão:<ul class="lst">' + P.falta.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>' : '');
      window.__copia = { id: copia.id, n: P.n, falta: P.falta };
   })
   .catch(function(e){ st.textContent = msgErro(e) + (copia ? ' (cópia: ' + (copia.webViewLink || copia.id) + ')' : ''); })
   .then(function(){ btn.disabled = false; });
}
function copiar(t, btn){
  var ok = function(){ if (btn) { var o = btn.textContent; btn.textContent = 'Copiado ✓'; setTimeout(function(){ btn.textContent = o; }, 1200); } };
  try { navigator.clipboard.writeText(t).then(ok, function(){ fallback(); }); } catch(e){ fallback(); }
  function fallback(){ var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch(e){} ta.remove(); }
}
document.addEventListener('click', function(ev){
  var b = ev.target.closest('[data-copia]'); if (b) { copiar(b.getAttribute('data-copia'), b); return; }
  if (ev.target.id === 'recalc') { calcular(); return; }
  if (ev.target.id === 'criaCopia') { criarCopia(ev.target); return; }
  if (ev.target.id === 'comparar') { comparar(); return; }
  if (ev.target.id === 'limpa') { FEITO = {}; salvaFeito(); calcular(); return; }
  if (ev.target.id === 'copiaTudo') {
    var L = window.__lista || { lista: [], fazer: [] }, t = [];
    if (L.cab) t.push('CABEÇALHO: ' + L.cab, '');
    L.lista.forEach(function(x){ t.push(x.quem); x.muds.forEach(function(m){ t.push('  ' + m.de + '  →  ' + m.para + (m.duv ? '  (conferir)' : '')); }); });
    if (L.fazer.length) { t.push('', 'PARA RESOLVER:'); L.fazer.forEach(function(x){ t.push('  ' + x.q + ' — ' + x.t); }); }
    copiar(t.join('\n'), ev.target); return;
  }
});
document.addEventListener('change', function(ev){
  var c = ev.target.closest('[data-feito]'); if (c) { if (c.checked) FEITO[c.getAttribute('data-feito')] = 1; else delete FEITO[c.getAttribute('data-feito')]; salvaFeito(); c.parentNode.classList.toggle('feito', c.checked); return; }
  if (ev.target.id === 'alvo' || ev.target.id === 'ref') calcular();
});
calcular();
})();
</script>
