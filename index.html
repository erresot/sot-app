<style>
:root{--bg2:#fafbfa;--tag:#eef1f0;--ic:#5b3fc4;--ic2:#ece8fb;--warnb:#f2c48d;--warnt:#7a3e00;
  --bg:#f3f5f4; --card:#fff; --ink:#15211d; --mut:#5d6b66; --line:#dde3e0;
  --acc:#0f6b5c; --acc2:#e3f1ed; --warn:#b45309; --warn2:#fdf1e2; --bad:#b42318; --bad2:#fdeceb; --ok:#15803d; --ok2:#e7f6ec;
  --evo:#1f5fbf; --evo2:#e2ecfb;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.top h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
.top .sub{display:flex;gap:10px;align-items:center;font-size:13px;opacity:.92;margin-top:4px;flex-wrap:wrap}
.top input[type=date]{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:3px 6px;font:inherit}
.prog{height:4px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:8px;overflow:hidden;position:relative}
.prog i{position:absolute;left:0;top:0;height:100%;background:#9ee6c9;width:0;transition:width .3s}
.prog i.e{background:#8fb8ff;height:50%;top:50%}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 84px);max-width:760px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:19px;line-height:1}
.tabs button.on{color:var(--acc);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.04);border:1px solid var(--line)}
.pt{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.leito{flex:none;width:58px;text-align:center;border-radius:10px;background:var(--acc2);color:var(--acc);font-weight:700;padding:8px 0;font-size:16px}
.leito small{display:block;font-weight:500;font-size:10.5px;opacity:.8}
.pt.done .leito{background:var(--ok2);color:var(--ok)}
.pt .nm{font-weight:650}
.pt .dx{color:var(--mut);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;border-radius:6px;padding:1px 6px;background:var(--tag);color:var(--ink)}
.tag.po{background:var(--acc2);color:var(--acc);font-weight:600}
.tag.hj{background:var(--warn2);color:var(--warn);font-weight:600}
.tag.ok{background:var(--ok2);color:var(--ok);font-weight:600}
.tag.evo{background:var(--evo2);color:var(--evo);font-weight:600}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--acc);color:#fff;font-weight:600;width:100%}
.btn.sec{background:var(--card);color:var(--acc);border:1px solid var(--acc)}
.btn.evo{background:var(--evo);color:#fff}
.btn.evos{background:var(--card);color:var(--evo);border:1px solid var(--evo)}
.btn.ghost{background:none;color:var(--mut);border:1px dashed var(--line)}
.btn.sm{padding:7px 10px;font-size:13.5px;width:auto;border-radius:9px}
.row{display:flex;gap:8px}
.row>*{flex:1}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:16px 2px 8px;font-weight:650}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.sh-top{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;display:flex;gap:10px;align-items:center}

.sh-top .t span{font-size:12.5px;color:var(--mut)}
.sh-body{padding:12px 12px calc(env(safe-area-inset-bottom) + 96px);max-width:760px;margin:0 auto}
details.ig{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}

.opts{display:flex;flex-wrap:wrap;gap:6px}
.op{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 11px;font-size:14px;min-height:38px}
.op.on{background:var(--acc);border-color:var(--acc);color:#fff}

.eva{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}

.num{display:flex;gap:8px;align-items:center;margin-top:6px}
.num input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;background:var(--bg2)}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg2);resize:vertical}
textarea.mono{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:140px}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.pend{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.pend:first-child{border-top:0}
.pend input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--acc)}
.pend .tx{flex:1;font-size:14px}
.pend.ok .tx{text-decoration:line-through;color:var(--mut)}
.pend .who{font-size:12px;color:var(--acc);font-weight:600;cursor:pointer}

.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
.add button{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:0 14px;font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px}
.out{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:#15211d;color:#fff;padding:9px 14px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}

.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
.modal.on{display:flex}
.modal .box{background:var(--card);width:100%;max-width:760px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin-bottom:8px}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:22px 14px;text-align:center;background:var(--card)}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.lock{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.agenda .when{font-weight:700;font-size:12px;color:var(--warn);min-width:56px}
/* evolução (tela cheia com o atualizador) */
#evoSheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}

.flow{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin:2px 2px 10px;flex-wrap:wrap}
.flow span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.flow span.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.flow span.done{border-color:var(--ok);color:var(--ok)}
.evrow{display:flex;gap:10px;align-items:center}
.evrow .st{flex:1;min-width:0}

.evrow .st span{font-size:12.5px;color:var(--mut)}
.tag.ic{background:var(--ic2);color:var(--ic);font-weight:600}

.q.redq .lb{color:var(--bad)}
details.ng{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px}

.ngrid{display:flex;flex-direction:column;gap:4px;margin-top:6px}

.camrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ======================= v51 · visual novo =======================
   Cabeçalho claro e leve, letra IBM Plex (a mesma do OrthoHub), ícones de traço,
   cartões com sombra suave, busca e modo compacto, painel lateral no computador. */
@font-face{font-family:'Plex';font-weight:400;font-display:swap;src:url(hub/fonts/plex-sans-400.woff2) format('woff2')}
@font-face{font-family:'Plex';font-weight:500;font-display:swap;src:url(hub/fonts/plex-sans-500.woff2) format('woff2')}
@font-face{font-family:'Plex';font-weight:600;font-display:swap;src:url(hub/fonts/plex-sans-600.woff2) format('woff2')}
@font-face{font-family:'Plex';font-weight:700 900;font-display:swap;src:url(hub/fonts/plex-sans-700.woff2) format('woff2')}
:root{--bg:#f4f5f2;--bg2:#f8f9f7;--card:#fff;--ink:#17211d;--mut:#66726d;--line:#e3e7e3;--tag:#f0f2ef;
  --acc:#0f6b5c;--acc2:#e5f1ec;--r:16px;
  --sh1:0 1px 2px rgba(20,32,28,.05),0 1px 1px rgba(20,32,28,.03);
  --sh2:0 2px 6px rgba(20,32,28,.06),0 12px 28px -12px rgba(20,32,28,.18)}
html.escuro{--bg:#0e1416;--bg2:#121a1c;--card:#172023;--line:#263236;--tag:#1f2a2d;--sh1:0 1px 0 rgba(0,0,0,.3);--sh2:0 10px 30px -10px rgba(0,0,0,.6)}
html,body{font-family:'Plex',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
.ico{width:20px;height:20px;display:block}

/* cabeçalho */
.top,html.escuro .top{background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);color:var(--ink);border-bottom:1px solid var(--line);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.hrow{gap:12px}
.marca{flex:none;width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#13846f,#0b5547);color:#fff;font:700 12px/36px 'Plex',sans-serif;text-align:center;letter-spacing:.6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.tit{flex:1;min-width:0;display:flex;flex-direction:column}
.top .tit h1,.top h1{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
#resumo{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb,.top .syncmini.hb{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:12px;width:40px;min-width:40px;height:40px;display:grid;place-items:center;transition:background .15s,color .15s}
.hb:hover,.top .syncmini.hb:hover{background:var(--bg);color:var(--ink)}
.hb .ico{width:19px;height:19px}
.syncmini small{top:-5px;right:-5px;border:2px solid var(--card)}
.sdot{position:absolute;bottom:6px;right:6px;width:7px;height:7px;border-radius:50%;background:transparent}
.sdot.ok{background:#22a06b}.sdot.sync{background:#3b82f6;animation:pulso 1.2s infinite}.sdot.erro{background:#e5484d}.sdot.off,.sdot.login{background:#f59e0b}
@keyframes pulso{50%{opacity:.25}}
.top .sub{margin-top:10px;gap:8px;opacity:1;flex-wrap:nowrap}
.top input[type=date]{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13.5px;flex:none}
.hojebtn{font:600 13px/1 'Plex',sans-serif;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mut);letter-spacing:0;flex:none}
.hojebtn.fora{background:#f5b301;border-color:#f5b301;color:#1a1a1a}
.top .prog{flex:1;margin:0;height:6px;background:var(--tag);border-radius:6px}
.prog i{background:#22a06b;border-radius:6px}.prog i.e{background:#4c8df6}
.verchip{margin-left:0;border:1px solid var(--line);color:var(--mut);opacity:1;flex:none}
.sync,.sync.ok{margin-top:8px;background:var(--acc2);color:var(--acc);border-radius:10px;padding:7px 10px;font-size:12.5px;min-height:0}
#sync.sync{min-height:0}
.sync.quieto{display:none}
.sync.off{background:#fff4e0;color:#8a4b00}.sync.erro{background:#fdecec;color:#a4161a}.sync.login{background:#ecebff;color:#3b3f8a}
html.escuro .sync.off{background:#33261a;color:#f3c48e}html.escuro .sync.erro{background:#3a1a1a;color:#ff9b9b}html.escuro .sync.login{background:#22223f;color:#b9b6ff}
.top input[type=date].naohoje{box-shadow:none;border-color:#c92a2a}
.top.compacto{padding-top:calc(env(safe-area-inset-top) + 8px);padding-bottom:8px}
.top.compacto #resumo{display:block}

/* abas */
.subtabs{background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:0;border-radius:0;margin:0 -12px 12px;padding:8px 12px;gap:4px;box-shadow:0 1px 0 var(--line)}
.subtabs button{border-radius:12px;padding:8px 4px;color:var(--mut);font-weight:500;position:relative;transition:background .15s,color .15s}
.subtabs button b .ico{width:19px;height:19px;margin:0 auto}
.subtabs button:hover{background:var(--card)}
.subtabs button.on,html.escuro .subtabs button.on{background:var(--card);color:var(--acc);font-weight:600;box-shadow:var(--sh1),0 0 0 1px var(--line)}
@media (min-width:700px){.subtabs{margin:0 0 14px;border-radius:14px;box-shadow:none;background:transparent;padding:0}.subtabs button b .ico{width:17px;height:17px}}
.tabs{background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tabs button b .ico{width:22px;height:22px;margin:0 auto 2px}
.tabs button{font-weight:500}.tabs button.on{color:var(--acc);font-weight:600}

/* cartões */
.card{border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh1);padding:14px}
.pt{transition:box-shadow .15s,border-color .15s,transform .15s}
@media (hover:hover){.pt:hover{box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--acc) 25%,var(--line))}}
.pt.sel,.mini.sel{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.leito{border-radius:12px;width:56px;font-size:17px;letter-spacing:-.02em}
.pt .nm{font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.pt .dx{font-size:13.5px;line-height:1.4;margin-top:1px}
.tags{gap:5px;margin-top:8px}
.tag{border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:500;background:var(--tag);color:color-mix(in srgb,var(--ink) 80%,var(--mut))}
.tag.red{font-weight:600}
.chip{border-radius:999px;padding:7px 13px;font-weight:500;background:var(--card)}
.chip.on{box-shadow:var(--sh1)}
h2{font-size:12px;letter-spacing:.7px;font-weight:600;margin:18px 4px 8px}
.btn{border-radius:12px;font-weight:600;transition:filter .15s,transform .05s}
.btn:active{transform:scale(.98)}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}}

/* busca + modo de exibição */
.ferr{display:flex;gap:8px;align-items:center;margin:0 0 10px}
.busca{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;color:var(--mut);box-shadow:var(--sh1)}
.busca:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.busca .ico{width:18px;height:18px;flex:none}
.busca input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;color:var(--ink);height:100%}
.dens{display:flex;background:var(--tag);border-radius:12px;padding:3px;flex:none}
.dens button{border:0;background:transparent;border-radius:9px;height:36px;padding:0 10px;display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px;font-weight:500}
.dens button .ico{width:17px;height:17px}
.dens button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
@media (max-width:520px){.dens button span{display:none}.dens button{padding:0 9px}}
[data-busca][hidden]{display:none!important}

/* modo compacto: uma linha por paciente */
.lista2.compacta{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden}
.mini{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:52px;border-top:1px solid var(--line);cursor:pointer}
.mini:first-child{border-top:0}
@media (hover:hover){.mini:hover{background:var(--bg2)}}
.mini.done .ml{background:var(--ok2);color:var(--ok)}
.mini .ml{flex:none;min-width:48px;text-align:center;font-weight:700;font-size:14px;color:var(--acc);background:var(--acc2);border-radius:9px;padding:5px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:84px}
.mini .mn{flex:1;min-width:0;display:flex;flex-direction:column}
.mini .mn b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mn small{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ms{flex:none;display:flex;gap:4px;align-items:center}
.mini .s{font-style:normal;min-width:22px;height:22px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:11.5px;font-weight:700;background:var(--tag);color:var(--mut)}
.mini .s .ico{width:13px;height:13px}
.mini .s.red{background:var(--bad2);color:var(--bad)}.mini .s.warn{background:var(--warn2);color:var(--warn)}.mini .s.hj{background:var(--warn2);color:var(--warn)}
.mini .s.pd{background:#fff1e6;color:#b45309}.mini .s.evo{background:var(--evo2);color:var(--evo)}.mini .s.ok{background:var(--ok2);color:var(--ok)}
html.escuro .mini .s.pd{background:#33261a;color:#f0a35a}
.card.minilista{padding:0;overflow:hidden}
.minilista .mini .btn.sm{padding:8px 14px}

/* avisos recolhidos */
details.aviso{background:var(--warn2);border:1px solid var(--warnb);color:var(--warnt);border-radius:14px;margin:0 0 10px;font-size:13.5px}
details.aviso.leve{background:var(--card);border-color:var(--line);color:var(--mut)}
details.aviso summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
details.aviso summary::-webkit-details-marker{display:none}
details.aviso summary .ico{width:18px;height:18px;flex:none}
details.aviso summary span{flex:1;min-width:0}

<div id="lock"><form class="lbox" id="lockForm" autocomplete="off"><div style="font-size:40px">🔒</div><h1>SOT · Visita + Evolução</h1><p>Uso restrito da equipe. Digite a senha para entrar.</p><input type="password" id="lockPw" placeholder="Senha" autocomplete="current-password" aria-label="Senha"><button type="submit" id="lockBtn">Entrar</button><div class="lerr" id="lockErr"></div></form></div>
<script>
(function () {
  function b64(buf) { var s = '', a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
  function deb64(t) { var s = atob(t), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function conferir(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits'])
      .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: deb64(LOCK.salt), iterations: LOCK.it, hash: 'SHA-256' }, k, 256); })
      .then(function (bits) { return b64(bits) === LOCK.hash; });
  }
  var erros = 0, esperaAte = 0, ultGrav = 0;
  function marcarUso() { var n = Date.now(); if (n - ultGrav > 20000) { ultGrav = n; try { localStorage.setItem('sot-ult', String(n)); } catch (e) {} } }
  function trancado() { return document.documentElement.classList.contains('trancado'); }
  function trancar() {
    try { sessionStorage.removeItem('sot-ok'); } catch (e) {}
    document.documentElement.classList.add('trancado');
    var pw = document.getElementById('lockPw'); if (pw) { pw.value = ''; setTimeout(function () { pw.focus(); }, 50); }
  }
  window.trancarApp = trancar;
  function vencido() { return Date.now() - (+localStorage.getItem('sot-ult') || 0) > LOCK.min * 60000; }
  ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (ev) { document.addEventListener(ev, function () { if (!trancado()) marcarUso(); }, { capture: true, passive: true }); });
  setInterval(function () { if (!trancado() && vencido()) trancar(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && !trancado() && vencido()) trancar(); });
  document.getElementById('lockForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var box = this, pw = document.getElementById('lockPw'), err = document.getElementById('lockErr'), bt = document.getElementById('lockBtn');
    if (Date.now() < esperaAte) { err.textContent = 'Muitas tentativas. Aguarde ' + Math.ceil((esperaAte - Date.now()) / 1000) + ' s.'; return; }
    if (!pw.value) { pw.focus(); return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = 'Este navegador não permite conferir a senha (abra pelo endereço https).'; return; }
    bt.disabled = true; bt.textContent = 'Conferindo…'; err.textContent = '';
    conferir(pw.value).then(function (ok) {
      bt.disabled = false; bt.textContent = 'Entrar';
      if (ok) {
        erros = 0; ultGrav = 0;
        try { sessionStorage.setItem('sot-ok', '1'); } catch (x) {}
        marcarUso(); pw.value = '';
        document.documentElement.classList.remove('trancado');
      } else {
        erros++; pw.value = ''; pw.focus();
        box.classList.remove('erro'); void box.offsetWidth; box.classList.add('erro');
        if (erros >= 5) { esperaAte = Date.now() + 30000; erros = 0; err.textContent = 'Senha incorreta. Aguarde 30 s para tentar de novo.'; }
        else err.textContent = 'Senha incorreta.';
      }
    }).catch(function () { bt.disabled = false; bt.textContent = 'Entrar'; err.textContent = 'Erro ao conferir a senha.'; });
  });
  if (trancado()) setTimeout(function () { var pw = document.getElementById('lockPw'); if (pw) pw.focus(); }, 300);
})();
</script>

  { k: 'bast', nomes: ['bastonetes', 'bastoes'] },
  { k: 'seg',  nomes: ['segmentados'] },
];

// Gasometria — refs arterial (A) e venosa (V)
const GASO = [
  { ab: 'PH',   nomes: ['ph'], ref: { A: { min: 7.35, max: 7.45 }, V: { min: 7.35, max: 7.45 } }, plaus: [6.5, 8] },
  { ab: 'PCO2', abA: 'PACO2', abV: 'PVCO2', nomes: ['paco2', 'pvco2', 'pco2', 'pressao parcial de co2'], ref: { A: { min: 35, max: 45 }, V: { min: 37, max: 50 } }, plaus: [5, 200] },
  { ab: 'PO2',  abA: 'PAO2', abV: 'PVO2', nomes: ['pao2', 'pvo2', 'po2', 'pressao parcial de o2'], ref: { A: { min: 80, max: 100 }, V: null }, plaus: [5, 700] },
  { ab: 'HCO3', nomes: ['c?hco3(?:[\\s\\-]*(?:std|padrao|real|act))?', 'bicarbonato(?:[\\s\\-]*(?:padrao|standard|real))?'], ref: { A: { min: 22, max: 26 }, V: { min: 22, max: 29 } }, plaus: [1, 70] },
  { ab: 'BE',   nomes: ['excesso de bases?', 'base excess', 'beecf', 'beb', 'be'], signed: true, ref: { A: { min: -2, max: 2 }, V: { min: -2, max: 2 } }, plaus: [-40, 40] },
  { ab: 'SATO2',abA: 'SATO2', abV: 'SVO2', nomes: ['sat\\.?\\s*o2', 'sao2', 'svo2', 'so2', 'saturacao(?: de (?:o2|oxigenio))?'], ref: { A: { min: 95, max: null }, V: null }, plaus: [5, 100] },
  { ab: 'LAC',  nomes: ['lactato', 'acido lactico'], ref: { A: { min: null, max: 2.0 }, V: { min: null, max: 2.0 } }, plaus: [0, 40],
    unit: a => /^\s*mg\s*\/\s*dl/.test(a) ? { min: null, max: 18 } : null },
];
const GASO_STOP = ['fio2', 'temperatura', 'hemoglobina', 'hb', 'sodio', 'potassio', 'cloro', 'cloreto', 'calcio', 'glicose', 'anion gap', 'tco2', 'co2 total', 'ctco2', 'p50', 'shunt', 'a-ado2', 'ado2', 'pao2\\/fio2'];

function matchesOf(t, src) {
  const re = nameRe(src), out = [];
  let m;
  while ((m = re.exec(t))) out.push({ start: m.index, end: m.index + m[0].length });
  return out;
}

function validOcc(t, occ, ex) {
  if (ex.notAfter && ex.notAfter.test(t.slice(occ.end, occ.end + 30))) return false;
  if (ex.notBefore && ex.notBefore.test(t.slice(Math.max(0, occ.start - 30), occ.start))) return false;
  return true;
}

// Monta índice de "paredes": inícios de todos os nomes conhecidos
function buildWalls(t, groups) {
  const walls = [];
  groups.forEach(g => g.nomes.forEach(src => matchesOf(t, src).forEach(o => walls.push({ ...o, id: g.id }))));
  walls.sort((a, b) => a.start - b.start);
  return walls;
}
function windowAfter(t, occ, walls, selfId, maxLen) {
  let end = Math.min(t.length, occ.end + maxLen);
  for (const w of walls) {
    if (w.start < occ.end) continue;
    if (w.start >= end) break;
    if (w.id === selfId) continue;
    end = w.start; break;
  }
  return t.slice(occ.end, end);
}

function pickNumber(w, ex, opts = {}) {
  let s = ex.clean ? ex.clean(w) : w;
  const seq = [];
  const rm = s.match(/resultado\s*[:.\-]?\s*/);
  if (rm) seq.push(...numbersIn(s.slice(rm.index + rm[0].length), ex.signed).slice(0, 1));
  seq.push(...numbersIn(s, ex.signed));
  for (const n of seq) {
    if (opts.needSecs && !/^\s*(s\b|seg|segundos)/.test(n.after)) continue;
    let v = toNum(n.raw, ex.thousands || !!ex.count);
    if (isNaN(v)) continue;
    if (n.neg) v = -v;
    let display = null;
    if (/^\s*mil\b/.test(n.after)) v *= 1000;
    if (ex.count && v < ex.count) v *= 1000;           // 7,5 (x10³) → 7500
    if (ex.count || (ex.thousands && /^\d{1,3}([.,]\d{3})+$/.test(n.raw))) display = String(Math.round(v));
    if (ex.plaus && !n.op && (v < ex.plaus[0] || v > ex.plaus[1])) continue;
    if (display === null) display = (n.neg ? '-' : '') + n.raw.replace(/\.(?=\d{3}(?!\d))(?=.*,)/g, '').replace(/[.,]/, '#').replace(/[.,]/g, '').replace('#', '.');
    return { v, display: (n.op || '') + display, op: n.op, w: s, a: n.after };
  }
  return null;
}

function extractGeneric(t, ex, walls) {
  for (const src of ex.nomes) {
    for (const occ of matchesOf(t, src)) {
      if (!validOcc(t, occ, ex)) continue;
      const w = windowAfter(t, occ, walls, ex.ab, 420);
      const r = pickNumber(w, ex, { needSecs: ex.secs && /seg|\ds\b/.test(w) });
      if (r) {
        if (/^\s*pos[\s\-]*transfus/.test(t.slice(occ.end, occ.end + 25))) r.tag = 'PÓS-TX';
        return r;
      }
      if (ex.qual) {
        const q = w.slice(0, 160).match(/\b(nao reagente|negativo|reagente|positivo)\b/);
        if (q) { const neg = /nao|negativo/.test(q[1]); return { qualTxt: neg ? 'NEG' : 'POS', altered: !neg }; }
      }
    }
  }
  return null;
}

// Bilirrubinas em bloco ("BILIRRUBINAS ... Total 0.8 / Direta 0.2 / Indireta 0.6")
function extractBiliBlock(t, ex) {
  for (const occ of matchesOf(t, 'bilirrubinas?')) {
    const blk = t.slice(occ.end, occ.end + 400);
    const m = blk.match(new RegExp('(?<![a-z])' + ex.bili + '(?![a-z])[^\\d\\n]{0,25}(\\d+(?:[.,]\\d+)?)'));
    if (m) { const v = toNum(m[1]); if (v >= ex.plaus[0] && v <= ex.plaus[1]) return { v, display: m[1].replace(',', '.') }; }
  }
  return null;
}

// Coagulograma: TP (segundos), atividade (%), INR/RNI
function extractCoag(t, which) {
  const heads = ['tempo de protrombina', 'tempo e atividade de protrombina', 'tempo de atividade de protrombina', 'protrombina', 'tap', 'tp'];
  const occs = [];
  heads.forEach(h => matchesOf(t, h).forEach(o => occs.push(o)));
  occs.sort((a, b) => a.start - b.start);
  const blocks = occs.map(o => {
    let blk = t.slice(o.end, o.end + 450);
    const stop = blk.search(/tromboplastina|ttpa|kptt|aptt|fibrinogenio|plaquetas|d[\s\-]*dimero/);
    return stop > 0 ? blk.slice(0, stop) : blk;
  });
  const NUM = '(\\d+(?:[.,]\\d+)?)';
  if (which === 'inr') {
    const zones = [...blocks, t];
    for (const z of zones) {
      const m = z.match(new RegExp('(?<![a-z])(?:inr|rni|r\\.n\\.i\\.?|i\\.n\\.r\\.?)(?![a-z])[^\\d\\n]{0,30}' + NUM));
      if (m) { const v = toNum(m[1]); if (v >= 0.5 && v <= 20) return { v, display: m[1].replace(',', '.') }; }
    }
    return null;
  }
  for (const b of blocks) {
    if (which === 'atv') {
      let m = b.match(new RegExp('atividade[^\\d\\n]{0,40}' + NUM)) || b.match(new RegExp(NUM + '\\s*%'));
      if (m) { const v = toNum(m[1]); if (v > 0 && v <= 200) return { v, display: m[1].replace(',', '.') }; }
    } else {
      let m = b.match(new RegExp('(?:tempo(?: do paciente)?|paciente|resultado)[^\\d\\n]{0,20}' + NUM + '\\s*(?:s\\b|seg)')) ||
              b.match(new RegExp('(?<![\\d.,])' + NUM + '\\s*(?:s\\b|seg)'));
      if (m) { const v = toNum(m[1]); if (v >= 5 && v <= 200) return { v, display: m[1].replace(',', '.') }; }
    }
  }
  // fallback direto ("Atividade protrombínica 85 %")
  if (which === 'atv') {
    const m = t.match(new RegExp('atividade (?:de )?protrombin\\w*[^\\d\\n]{0,30}' + NUM));
    if (m) return { v: toNum(m[1]), display: m[1].replace(',', '.') };
  }
  return null;
}

function extractDiff(t, walls) {
  const res = {};
  let found = 0;
  for (const d of DIFF) {
    res[d.k] = null;
    outer: for (const src of d.nomes) {
      for (const occ of matchesOf(t, src)) {
        const w = windowAfter(t, occ, walls, 'diff_' + d.k, 120);
        const m = w.match(/(?<![\w.,])(\d+(?:[.,]\d+)?)\s*%/) || (numbersIn(w)[0] && { 1: numbersIn(w)[0].raw });
        if (m) { const v = toNum(m[1]); if (v >= 0 && v <= 100) { res[d.k] = m[1].replace(',', '.'); found++; break outer; } }
      }
    }
  }
  if (!found) return null;
  return ['mi', 'meta', 'bast', 'seg'].map(k => res[k] ?? '0').join('-');
}

function detectarData(t) {
  const lab = t.match(/(?:data\s*(?:da|de)?\s*coleta|coletad[oa]\s*(?:em)?|coleta|data\s*(?:do)?\s*(?:exame|atendimento|resultado))[^\d\n]{0,25}(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/);
  let m = lab;
  if (!m) {
    const re = /(?<![\d\/])(\d{2})\/(\d{2})\/(\d{2,4})(?![\d\/])/g;
    let x;
    while ((x = re.exec(t))) {
      if (/nasc|dn\b|d\.n\./.test(t.slice(Math.max(0, x.index - 25), x.index))) continue;
      m = x; break;
    }
  }
  if (!m) return '';
  const d = +m[1], mo = +m[2];
  if (d < 1 || d > 31 || mo < 1 || mo > 12) return '';
  const ano = m[3] ? (m[3].length === 2 ? '20' + m[3] : m[3]) : '';
  return String(d).padStart(2, '0') + '/' + String(mo).padStart(2, '0') + (ano ? '/' + ano : '');
}

function isAltered(v, ref) {
  if (!ref) return false;
  if (ref.min != null && v < ref.min) return true;
  if (ref.max != null && (ref.strict ? v >= ref.max : v > ref.max)) return true;
  return false;
}

function avaliarOp(op, v, ref) {
  // "<5" com ref máx 5 → normal; ">200" com ref máx 40 → alterado
  if (!ref) return false;
  if (op.startsWith('<')) return ref.min != null && v <= ref.min;
  if (op.startsWith('>')) return ref.max != null && v >= ref.max;
  return isAltered(v, ref);
}

// Extras da gasometria (opcional): eletrólitos/metabólitos do mesmo painel
const GASO_EXTRA = [
  { ab: 'NA',     nomes: ['sodio'], ref: { min: 136, max: 145 }, plaus: [90, 200] },
  { ab: 'K',      nomes: ['potassio'], ref: { min: 3.5, max: 5.1 }, plaus: [1, 12] },
  { ab: 'CA ION', nomes: ['calcio ionico', 'calcio ionizado'], ref: { min: 1.15, max: 1.35 }, plaus: [0.3, 8] },
  { ab: 'CL',     nomes: ['cloro', 'cloreto'], ref: { min: 98, max: 107 }, plaus: [50, 160] },
  { ab: 'GLIC',   nomes: ['glicose'], ref: { min: 75, max: 99 }, plaus: [5, 3000] },
  { ab: 'HB',     nomes: ['hb', 'hemoglobina'], notBefore: /(o2|co|h|met|oxi|carboxi)\s*$/, ref: { min: 10, max: 18 }, plaus: [1, 30] },
  { ab: 'HT',     nomes: ['ht', 'hematocrito'], ref: { min: 30, max: 54 }, plaus: [3, 90] },
];

function detectarSexoIdade(t) {
  const sx = t.match(/(?<![a-z])sexo\s*:?\s*(masculino|feminino|m|f)(?![a-z])/);
  const id = t.match(/(?<![a-z])idade\s*:?\s*(\d{1,3})/);
  return { sexo: sx ? sx[1][0].toUpperCase() : '', idade: id ? +id[1] : null };
}

// Divide o texto em laudos (um por cabeçalho "Requisição ... Data: dd/mm/aa hh:mm")
function segmentar(t) {
  const re = /requisicao\s*:?\s*\d+[^\n]*?\bdata\s*:?\s*(\d{1,2})\/(\d{1,2})\/(\d{2,4})(?:\s+(\d{1,2}):(\d{2}))?/g;
  const heads = [];
  let m;
  while ((m = re.exec(t))) heads.push(m);
  if (!heads.length) {
    const d = detectarData(t);
    return [{ txt: t, data: d, key: d ? (d.slice(6) || '0000') + d.slice(3, 5) + d.slice(0, 2) : '', hora: '' }];
  }
  return heads.map((h, i) => {
    let ano = h[3].length === 2 ? '20' + h[3] : h[3];
    const dd = h[1].padStart(2, '0'), mm = h[2].padStart(2, '0');
    return {
      txt: t.slice(h.index, i + 1 < heads.length ? heads[i + 1].index : t.length),
      data: `${dd}/${mm}/${ano}`, key: `${ano}${mm}${dd}`,
      hora: h[4] ? h[4].padStart(2, '0') + ':' + h[5] : ''
    };
  });
}

function refFor(ex, cfg, ctx) {
  const user = (cfg.refs || {})[ex.ab];
  if (user) return { ...ex.ref, ...user };
  if (ex.sexAge && cfg.sexRef !== false) { const r = ex.sexAge(ctx.sexo, ctx.idade); if (r) return r; }
  return { ...ex.ref };
}

// Processa UM laudo/segmento
function processarSegmento(t, cfg, ctx) {
  const disabled = cfg.disabled || {};
  const mainGroups = EXAMES.filter(e => e.nomes).map(e => ({ id: e.ab, nomes: e.nomes }));
  const gasoShared = new Set(['NA', 'K', 'CL', 'CA ION', 'CAT', 'GLIC', 'AC LAT', 'HB', 'HT']);
  const strongWalls = buildWalls(t, mainGroups.filter(g => !gasoShared.has(g.id)).concat([{ id: 'hemo', nomes: ['hemograma', 'coagulograma', 'eritrograma', 'leucograma', 'urina', 'eas'] }]));
  const gasoHeads = matchesOf(t, 'gasometria(?:\\s*[-:]?\\s*(?:arterial|venosa|venosa central|mista))?|gaso\\s*(?:arterial|venosa)');
  const gasoBlocks = [];
  gasoHeads.forEach((h, i) => {
    const head = t.slice(h.start, h.end);
    let end = Math.min(t.length, h.end + 1500);
    if (gasoHeads[i + 1]) end = Math.min(end, gasoHeads[i + 1].start);
    for (const w of strongWalls) { if (w.start > h.end + 5 && w.start < end) { end = w.start; break; } }
    const tipo = /venosa/.test(head) ? 'V' : /arterial/.test(head) ? 'A' : '';
    gasoBlocks.push({ start: h.start, end, tipo, txt: t.slice(h.end, end) });
  });
  let tMain = t;
  for (const b of gasoBlocks) tMain = tMain.slice(0, b.start) + ' '.repeat(b.end - b.start) + tMain.slice(b.end);

  const walls = buildWalls(tMain, mainGroups.concat(
    [{ id: 'stop', nomes: STOPPERS }],
    DIFF.map(d => ({ id: 'diff_' + d.k, nomes: d.nomes }))
  ));
  const itens = {};
  for (const ex of EXAMES) {
    let r = null;
    if (ex.coag) r = extractCoag(tMain, ex.coag);
    else {
      r = extractGeneric(tMain, ex, walls);
      if (!r && ex.bili) r = extractBiliBlock(tMain, ex);
    }
    if (!r) continue;
    let item;
    if (r.qualTxt) item = { val: r.qualTxt, alt: r.altered };
    else {
      let ref = refFor(ex, cfg, ctx);
      if (ex.unit) { const u = ex.unit(r.a || '', r.v); if (u) ref = u; }
      item = { val: r.display, v: r.v, alt: r.op ? avaliarOp(r.op, r.v, ref) : isAltered(r.v, ref), unidade: ref.nota || '', tag: r.tag || '' };
    }
    if (ex.ab === 'LEUCO' && cfg.diff !== false) item.diff = extractDiff(tMain, walls);
    item.hidden = oculto(ex.ab, cfg);
    itens[ex.ab] = item;
  }

  const gasos = [];
  const extras = cfg.gasoExtra ? GASO_EXTRA : [];
  const gWallsGroups = GASO.concat(extras).map(g => ({ id: g.ab, nomes: g.nomes })).concat([{ id: 'gstop', nomes: GASO_STOP.concat(STOPPERS) }]);
  for (const b of gasoBlocks) {
    const gw = buildWalls(b.txt, gWallsGroups);
    const tipo = b.tipo || 'A';
    const params = [];
    for (const g of GASO) {
      const r = extractGeneric(b.txt, g, gw);
      const label = (tipo === 'V' ? g.abV : g.abA) || g.ab;
      if (!r) { params.push({ ab: label, val: null }); continue; }
      let ref = g.ref[tipo];
      if (g.unit && ref) { const u = g.unit(r.a || '', r.v); if (u) ref = u; }
      params.push({ ab: label, val: r.display, v: r.v, alt: ref ? isAltered(r.v, ref) : false });
    }
    for (const g of extras) {
      const r = extractGeneric(b.txt, g, gw);
      if (r) params.push({ ab: g.ab, val: r.display, v: r.v, alt: isAltered(r.v, g.ref) });
    }
    if (params.some(p => p.val !== null)) gasos.push({ label: b.tipo === 'V' ? 'GASO V' : b.tipo === 'A' ? 'GASO A' : 'GASO', params, hidden: !cfg.gaso });
  }
  return { itens, gasos };
}

// cfg: { refs, disabled, diff, sexRef, gasoExtra }
// Retorna { dias: [{ data, itens:[{ab, vals:[...]}], gasos:[...] }], faltando, sexo, idade }
function processar(raw, cfg = {}) {
  const t = norm(raw);
  const ctx = detectarSexoIdade(t);
  const segs = segmentar(t).map((sg, i) => ({ ...sg, ordem: i, res: processarSegmento(sg.txt, cfg, ctx) }));
  segs.sort((a, b) => (a.key + a.hora).localeCompare(b.key + b.hora) || a.ordem - b.ordem);

  const diasMap = new Map();
  for (const sg of segs) {
    if (!diasMap.has(sg.key)) diasMap.set(sg.key, { data: sg.data, por: {}, gasos: [], ocultos: [] });
    const dia = diasMap.get(sg.key);
    for (const [ab, it] of Object.entries(sg.res.itens)) {
      if (it.hidden) {
        if (it.alt && !dia.ocultos.some(o => o.ab === ab && o.val === it.val)) dia.ocultos.push({ ab, val: it.val });
        continue;
      }
      const lista = dia.por[ab] = dia.por[ab] || [];
      const ult = lista[lista.length - 1];
      const sig = it.val + '|' + (it.diff || '') + '|' + it.tag;
      if (ult && ult.sig === sig) continue;            // mesmo valor repetido (ex.: plaquetas do hemograma + contagem)
      lista.push({ ...it, sig, hora: sg.hora });
    }
    for (const g of sg.res.gasos) {
      if (g.hidden) {
        g.params.filter(p => p.alt).forEach(p => {
          const ab = `${p.ab} (${g.label})`;
          if (!dia.ocultos.some(o => o.ab === ab && o.val === p.val)) dia.ocultos.push({ ab, val: p.val });
        });
        continue;
      }
      const sig = g.label + JSON.stringify(g.params.map(p => p.val));
      if (!dia.gasos.some(x => x.sig === sig)) dia.gasos.push({ ...g, sig, hora: sg.hora });
    }
  }
  const encontrados = new Set();
  const dias = [...diasMap.values()].map(d => ({
    data: d.data,
    itens: EXAMES.filter(e => d.por[e.ab]).map(e => { encontrados.add(e.ab); return { ab: e.ab, vals: d.por[e.ab] }; }),
    gasos: d.gasos,
    ocultos: d.ocultos
  })).filter(d => d.itens.length || d.gasos.length || d.ocultos.length);
  const faltando = EXAMES.filter(e => !encontrados.has(e.ab) && !oculto(e.ab, cfg)).map(e => e.ab);
  return { dias, faltando, sexo: ctx.sexo, idade: ctx.idade, nSeg: segs.length };
}

// ===================== paciente pelo REGISTRO (leito e setor podem mudar) =====================

// ===================== quem sumiu do internograma / limpeza após 5 dias =====================

(function () {
  var saindo = false, precisa = true;
  function armar() { try { history.pushState({ sot: 1 }, ''); } catch (e) {} precisa = false; }
  try { if (!history.state || !history.state.sot) history.replaceState({ sot: 0 }, ''); } catch (e) {}

    var mb = document.querySelector('#mbox'), md = document.querySelector('#modal');

      md.classList.remove('on'); md.removeAttribute('data-sair'); saindo = true;

      if (window.SYNC && SYNC.temToken() && SYNC.contarPend().total) { toast('Enviando para o Google antes de sair…'); Promise.race([SYNC.agora(), new Promise(function (r) { setTimeout(r, 8000); })]).then(irEmbora); }
      else irEmbora();

    };
  }
  window.addEventListener('popstate', function () {
    if (saindo) { history.back(); return; }
    var q = function (s) { return document.querySelector(s); };
    var aberto = function (s, c) { var el = q(s); return el && el.classList.contains(c); };
    precisa = true; armar(); precisa = true;
    if (aberto('#modal', 'on')) { q('#modal').classList.remove('on'); q('#modal').removeAttribute('data-sair'); return; }
    if (aberto('#viewer', 'on')) { q('#viewer').classList.remove('on'); return; }

  });

})();

/* v14: dreno em mL/hora */
function drenoTaxa(d) {
  var tot = ['d', 'e', 'u'].map(function (k) { return parseFloat(String((d || {})[k] || '').replace(',', '.')); }).filter(function (x) { return !isNaN(x); });
  if (!tot.length) return null;
  var soma = tot.reduce(function (a, b) { return a + b; }, 0), hh = parseFloat(String((d || {}).h || '').replace(',', '.'));
  var per = hh > 0 ? hh : 24;

}
function drenoTaxaTxt(d) {
  var r = drenoTaxa(d); if (!r) return '';
  return (r.informado ? ' em ' + String(r.h).replace('.', ',') + ' h' : ' em 24 h') + ' (' + r.taxa.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mL/h)';
}

/* v21: pendências automáticas do internograma — sem duplicar (acento, versão mais longa/curta) e sem acumular versões antigas */
function chavePend(t) { return String(t || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z0-9]/g, ''); }
function pendParecida(a, b) { return a === b || (a.length >= 8 && b.length >= 8 && (a.indexOf(b) === 0 || b.indexOf(a) === 0 || (a.length > 14 && b.length > 14 && (a.indexOf(b) > -1 || b.indexOf(a) > -1)))); }
function mesclarPendAuto(p, ja, del) {
  S.pendDel = S.pendDel || {}; del = S.pendDel[p.id] = del || [];
  var agora = (typeof relogio === 'function') ? relogio() : Date.now();
  // lápide com hora: só apaga o que já existia; texto igual criado depois continua (ver sync.js)
  var apagar = function (t) { var i = -1; del.forEach(function (d, j) { if ((d.t || d) === t) i = j; }); var l = { t: t, at: agora }; if (i < 0) del.push(l); else if (typeof del[i] !== 'string' && (del[i].at || 0) < agora) del[i] = l; };
  var foiApagada = function (t) { return del.some(function (d) { return (d.t || d) === t; }); };
  var sug = (p.sugPend || []).map(function (t) { return { t: t, k: chavePend(t) }; });
  // 1) automáticas que o internograma não traz mais (texto mudou ou saiu) → saem (e saem dos outros aparelhos)
  ja = ja.filter(function (x) {
    if (!x.auto || x.ok) return true;
    var k = chavePend(x.t), s = sug.filter(function (q) { return pendParecida(q.k, k); });
    if (s.some(function (q) { return q.t === x.t; })) return true;
    apagar(x.t); return false;
  });
  // 2) duplicadas entre si (mesma coisa com acento/maiúscula/trecho a mais)
  var fica = [];
  ja.forEach(function (x) {
    var k = chavePend(x.t), i = -1;
    fica.forEach(function (y, j) { if (i < 0 && pendParecida(chavePend(y.t), k)) i = j; });
    if (i < 0) { fica.push(x); return; }
    var y = fica[i], manter = (!x.auto || x.ok) && (y.auto && !y.ok) ? x : (!y.auto || y.ok) ? y : (x.t.length > y.t.length ? x : y), sai = manter === x ? y : x;
    if (sai.auto && !sai.ok) apagar(sai.t);
    fica[i] = manter;
    if (sai.ok && !manter.ok) manter.ok = true;
  });
  // 3) novas do internograma
  sug.forEach(function (q) {
    if (foiApagada(q.t)) return;
    if (fica.some(function (x) { return pendParecida(chavePend(x.t), q.k); })) return;
    fica.push({ t: q.t, ok: false, auto: true, at: 0 });
  });
  return fica;
}

/* v21: paciente trocou de id (ex.: PS sem registro → ala com registro) — leva visitas, evoluções, pendências e fotos junto */
function moverDados(de, para) {
  if (!de || !para || de === para) return;
  S.movidos = S.movidos || {}; if (S.movidos[de] === para) return; S.movidos[de] = para;

  if ((S.fotos || {})[de]) { var F = S.fotos[para] = S.fotos[para] || []; S.fotos[de].forEach(function (f) { if (!F.some(function (y) { return y.lid === f.lid; })) F.push(f); }); }

/* ---------- atalhos de teclado (computador) ----------
   /  buscar · 1–5 abas · Esc fecha · ↓/J e ↑/K próximo/anterior paciente (com a ficha aberta)
   V  marca visitado e vai ao próximo · E evoluir · ?  mostra os atalhos */
document.addEventListener('keydown', function (ev) {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var t = ev.target, digitando = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  if (ev.key === 'Escape') {
    if (t && t.id === 'busca') { t.value = ''; BUSCA = ''; aplicarBusca(); t.blur(); return; }
    if ($('#modal').classList.contains('on')) { $('#modal').classList.remove('on'); return; }
    if ($('#evoSheet').classList.contains('open')) return;   // a evolução tem o próprio "voltar"
    if (atual && $('#sheet').classList.contains('open')) { ev.preventDefault(); fechar(); }
    return;
  }
  if (digitando || $('#evoSheet').classList.contains('open') || $('#modal').classList.contains('on')) return;
  var k = ev.key, fichaAberta = atual && $('#sheet').classList.contains('open');
  if (k === '/') { var b = $('#busca'); if (b) { ev.preventDefault(); b.focus(); b.select(); } return; }
  if (/^[1-5]$/.test(k) && S.sec === 'enf') { var tabs = ['leitos', 'pend', 'saida', 'agenda', 'config']; if (S.tab !== tabs[k - 1]) BUSCA = ''; S.tab = tabs[k - 1]; saveLocal(); render(); window.scrollTo(0, 0); return; }
  if (k === '?') { ajudaAtalhos(); return; }
  if (!fichaAberta) return;
  var lista = ativos().filter(function (p) { return S.filtro === 'Todos' || p.grupo === S.filtro; });
  var i = lista.findIndex(function (p) { return p.id === atual.id; });
  if (k === 'ArrowDown' || k === 'j' || k === 'J') { if (i < lista.length - 1) { ev.preventDefault(); abrir(lista[i + 1].id); } return; }
  if (k === 'ArrowUp' || k === 'k' || k === 'K') { if (i > 0) { ev.preventDefault(); abrir(lista[i - 1].id); } return; }
  if (k === 'v' || k === 'V') { ev.preventDefault(); proximo(); return; }
  if (k === 'e' || k === 'E') { ev.preventDefault(); abrirEvo(atual.id); return; }
});

// altura real do cabeçalho → a barra de abas gruda logo embaixo dele (não fica escondida atrás)
(function () {
  var top = document.querySelector('.top'); if (!top) return;
  function mede() { document.documentElement.style.setProperty('--topH', top.offsetHeight + 'px'); }
  mede();
  if (window.ResizeObserver) new ResizeObserver(mede).observe(top); else window.addEventListener('resize', mede);
  // ao rolar a lista para baixo, o cabeçalho encolhe (só título e botões); volta inteiro perto do topo
  var compacto = false, pend = false;
  function ver() {
    pend = false;
    if (document.documentElement.classList.contains('travado')) return;
    var y = window.scrollY, h0 = top.offsetHeight;
    if (!compacto && y > 160) { compacto = true; top.classList.add('compacto'); }
    else if (compacto && y < 8) { compacto = false; top.classList.remove('compacto'); }
    else return;
    // compensa a mudança de altura para a lista não "pular"
    var dh = top.offsetHeight - h0; mede();
    if (dh && compacto) window.scrollBy(0, dh);
  }
  window.addEventListener('scroll', function () { if (!pend) { pend = true; requestAnimationFrame(ver); } }, { passive: true });
})();

    var c = document.createElement('canvas'); c.width = w; c.height = h; var x = c.getContext('2d'), id = x.createImageData(w, h);
    for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) { var v = R.g[(y0 + yy) * R.w + x0 + xx], j = (yy * w + xx) * 4; id.data[j] = id.data[j + 1] = id.data[j + 2] = v; id.data[j + 3] = 255; }
    x.putImageData(id, 0, 0);
    return new Promise(function (ok) { c.toBlob(function (b) { ok({ blob: b, url: c.toDataURL('image/jpeg', 0.8) }); }, 'image/jpeg', 0.85); });
  }
  function miniatura(A) {   // folha endireitada com as marcações coloridas (para conferir a leitura)
    var R = A.R, k = 0.5, W = Math.round(R.w * k), H = Math.round(R.h * k), c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d'), id = x.createImageData(W, H);
    for (var yy = 0; yy < H; yy++) for (var xx = 0; xx < W; xx++) { var v = R.g[Math.floor(yy / k) * R.w + Math.floor(xx / k)], j = (yy * W + xx) * 4; id.data[j] = id.data[j + 1] = id.data[j + 2] = v; id.data[j + 3] = 255; }
    x.putImageData(id, 0, 0); x.lineWidth = 2;
    A.L.forEach(function (b) { if (!b.st) return; x.strokeStyle = b.st === 'on' ? '#16a34a' : '#f59e0b'; x.strokeRect((b.r[0] - 0.6) * R.ppm * k, (b.r[1] - 0.6) * R.ppm * k, (b.r[2] + 1.2) * R.ppm * k, (b.r[3] + 1.2) * R.ppm * k); });
    return c.toDataURL('image/jpeg', 0.75);
  }

  // ---------- 3) revisão ----------
  var REV = null;
  function abrirRevisao(files) {
    var tela = document.getElementById('folhaRev');
    if (!tela) { tela = document.createElement('div'); tela.id = 'folhaRev'; tela.className = 'sheet'; document.body.appendChild(tela); }
    tela.innerHTML = '<div class="sh-top"><button class="back" data-frfechar>‹</button><div class="t"><b>Ler folha de visita</b><span>lendo ' + files.length + ' foto(s)…</span></div></div><div class="sh-body"><div class="empty">Lendo a foto…</div></div>';
    tela.classList.add('open'); document.body.classList.add('travado');
    var res = [];
    return files.reduce(function (pr, f) { return pr.then(function () { return lerArquivo(f).then(function (r) { r.nome = f.name; res.push(r); }, function (er) { res.push({ erro: 'Erro ao ler ' + f.name + ': ' + (er && er.message || er), nome: f.name }); }); }); }, Promise.resolve())
      .then(function () {
        var okR = res.filter(function (r) { return !r.erro; });
        return Promise.all(okR.map(function (A) {
          return Promise.all(Object.keys(A.pac).map(function (pid) { return Promise.all(A.pac[pid].notas.map(function (n) { return recorte(A.R, n.r).then(function (o) { n.blob = o.blob; n.url = o.url; }); })); }));
        })).then(function () { REV = { res: res, sel: {} }; montarSelecao(); desenharRev(); });
      });
  }
  function montarSelecao() {   // estado inicial: marcadas = ligadas; duvidosas e conflitos = desligadas, mas destacadas
    REV.res.forEach(function (A, ai) {
      if (A.erro) return;
      Object.keys(A.pac).forEach(function (pid) {
        var P = A.pac[pid], K = ai + '|' + pid, st = REV.sel[K] = { g: {}, visit: false, notas: P.notas.map(function () { return { usar: true, txt: '' }; }) };
        Object.keys(P.grupos).forEach(function (g) {
          var gg = P.grupos[g], D = G[g], on = gg.on.slice();
          if (g === 'visit') { st.visit = on.length > 0; return; }
          var conflito = D.t === 's' && on.length > 1;
          st.g[g] = { on: conflito ? [] : on, duv: gg.duv.slice(), conflito: conflito ? on : [] };
        });
        // "neuro sem alterações" + força marcada = contradição → você escolhe
        var forca = Object.keys(st.g).some(function (g) { return /^f[CTLS]\d/.test(g) && st.g[g].on.length; });
        if (forca && st.g.neuro && st.g.neuro.on.indexOf(0) > -1) { st.g.neuro.conflito = uniq(st.g.neuro.conflito.concat(st.g.neuro.on)); st.g.neuro.on = []; st.g.neuro.dica = 'força marcada abaixo — confirme'; }
        if (!st.visit && Object.keys(st.g).some(function (g) { return st.g[g].on.length; })) st.visit = true;
      });
    });
  }
  function nomeDe(A, pid) { var p = S.pacientes.find(function (x) { return x.id === pid; }), n = (A.job.nomes || {})[pid] || []; return { leito: p ? (p.leito || p.lugar || '') : n[0] || '', nome: p ? p.nome : n[1] || pid, existe: !!p }; }
  function desenharRev() {
    var tela = document.getElementById('folhaRev'), h = '', tot = 0, duv = 0;
    REV.res.forEach(function (A, ai) {
      if (A.erro) { h += '<div class="card frerro"><b>⚠ ' + e(A.nome || 'foto') + '</b><div>' + e(A.erro) + '</div></div>'; return; }
      var outroDia = A.job.data !== S.hoje;
      h += '<div class="card frpag"><div class="frinfo"><b>Folha ' + A.pag.n + ' de ' + A.job.pags.length + '</b> · nº ' + A.job.id + ' · impressa ' + e(br(A.job.data)) + (A.job.by ? ' por ' + e(A.job.by) : '') + '</div>' +
        (outroDia ? '<div class="fraviso">⚠ Esta folha é de ' + e(br(A.job.data)) + ' — as marcações vão para a visita DESSE dia.</div>' : '') +
        '<details><summary>Ver como o app leu a folha (verde = marcado, amarelo = em dúvida)</summary><img class="frmini" src="' + miniatura(A) + '" alt=""></details></div>';
      A.pag.pids.forEach(function (pid) {
        var K = ai + '|' + pid, st = REV.sel[K], P = A.pac[pid], nm = nomeDe(A, pid), gs = '';
        Object.keys(G).forEach(function (g) {
          var x = st.g[g]; if (!x) return;
          var opts = uniq(x.on.concat(x.duv, x.conflito)); if (!opts.length) return;
          gs += '<div class="frg"><span class="frl">' + e(G[g].lb) + '</span>' + opts.map(function (i) {
            var on = x.on.indexOf(i) > -1, d = x.duv.indexOf(i) > -1, c = x.conflito.indexOf(i) > -1;
            if (d || c) duv++;
            return '<button class="frc' + (on ? ' on' : '') + (d ? ' duv' : '') + (c ? ' conf' : '') + '" data-frk="' + e(K) + '" data-frg="' + g + '" data-fri="' + i + '">' + (d && !on ? '? ' : '') + e(G[g].o[i][0]) + '</button>';
          }).join('') + (x.conflito.length && !x.on.length ? '<span class="frdica">' + (x.dica || 'duas marcadas — escolha uma') + '</span>' : '') + '</div>';
        });
        var nt = P.notas.map(function (n, j) {
          var s = st.notas[j];
          return '<div class="frnota"><div class="frl">' + e(COLN[n.col]) + ' — escrito à mão</div><img src="' + n.url + '" alt=""><label><input type="checkbox" data-frnota="' + e(K) + '|' + j + '"' + (s.usar ? ' checked' : '') + '> guardar como foto no paciente</label><input class="frtx" data-frtx="' + e(K) + '|' + j + '" placeholder="Digite aqui se quiser que vire texto (vai para Observações)" value="' + e(s.txt) + '"></div>';
        }).join('');
        if (!gs && !nt && !st.visit) { h += '<div class="frvazio">' + e(nm.leito) + ' · ' + e(nm.nome) + ' — nada marcado</div>'; return; }
        tot++;
        h += '<div class="card frpac"><div class="frh"><span class="ml">' + e(nm.leito || '—') + '</span><b>' + e(nm.nome) + '</b>' + (nm.existe ? '' : '<span class="tag red">fora do internograma atual</span>') +
          '<label class="frvis"><input type="checkbox" data-frvis="' + e(K) + '"' + (st.visit ? ' checked' : '') + '> visitado</label></div>' + (gs || '<div class="hint">Nenhuma caixinha marcada.</div>') + nt + '</div>';
      });
    });
    tela.innerHTML = '<div class="sh-top"><button class="back" data-frfechar>‹</button><div class="t"><b>Revisar folha de visita</b><span>' + tot + ' paciente(s) com marcações' + (duv ? ' · ' + duv + ' item(ns) em amarelo para conferir' : '') + '</span></div></div>' +
      '<div class="sh-body">' + (duv ? '<div class="fraviso">Itens em <b>amarelo</b> estão em dúvida (marca fraca ou duas opções no mesmo item) e só entram se você tocar neles.</div>' : '') + h + '</div>' +
      '<div class="foot"><button class="btn sec" data-frfechar style="flex:1">Cancelar</button><button class="btn" data-frsalvar style="flex:1.6"' + (tot ? '' : ' disabled') + '>Salvar nas visitas (' + tot + ')</button></div>';
  }
  function alternar(K, g, i) {
    var x = REV.sel[K].g[g], D = G[g], k = x.on.indexOf(i);
    if (k > -1) x.on.splice(k, 1);
    else { if (D.t === 's') x.on = [i]; else x.on.push(i); }
    desenharRev();
  }
  function salvar() {
    var n = 0, fotos = [];
    REV.res.forEach(function (A, ai) {
      if (A.erro) return;
      var d = A.job.data; S.vis[d] = S.vis[d] || {};
      A.pag.pids.forEach(function (pid) {
        var K = ai + '|' + pid, st = REV.sel[K], P = A.pac[pid];
        var temAlgo = st.visit || Object.keys(st.g).some(function (g) { return st.g[g].on.length; }) || st.notas.some(function (s) { return (s.usar) || s.txt.trim(); });
        if (!temAlgo) return;
        visSnap(d, pid);
        var v = S.vis[d][pid] = S.vis[d][pid] || {};
        Object.keys(st.g).forEach(function (g) {
          var x = st.g[g], D = G[g]; if (!x.on.length) return;
          var vals = x.on.map(function (i) { return D.o[i][1]; });
          D.ap(v, D.t === 'm' ? vals : vals[0]);
        });
        if (st.visit) v._ok = true;
        var txt = st.notas.map(function (s, j) { return s.txt.trim() ? COLN[P.notas[j].col].split(' ·')[0] + ': ' + s.txt.trim() : ''; }).filter(Boolean).join('\n');
        if (txt) v.obs = (v.obs ? v.obs.trim() + '\n' : '') + txt;
        carimbarV(d, pid); v._at = relogio(); v._by = S.eu || '';
        st.notas.forEach(function (s, j) { if (s.usar && P.notas[j].blob) fotos.push([pid, P.notas[j]]); });
        n++;
      });
    });
    save();
    return fotos.reduce(function (pr, f) { return pr.then(function () { return FOTO.adicionar(f[0], 'nota', f[1].blob, 'Folha · ' + COLN[f[1].col].split(' ·')[0]).catch(function () {}); }); }, Promise.resolve())
      .then(function () { fecharRev(); render(); toast('Visita gravada em ' + n + ' paciente(s)' + (fotos.length ? ' · ' + fotos.length + ' anotação(ões) guardada(s) como foto' : '')); });
  }
  function fecharRev() { var t = document.getElementById('folhaRev'); if (t) { t.classList.remove('open'); t.innerHTML = ''; } REV = null; if (typeof travar === 'function') travar(); }

  // ---------- eventos ----------
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-folhaimp],[data-frfechar],[data-frsalvar],[data-frk]'); if (!t) return;
    if ('folhaimp' in t.dataset) { imprimir(); return; }
    if ('frfechar' in t.dataset) { fecharRev(); return; }
    if ('frsalvar' in t.dataset) { t.disabled = true; salvar(); return; }
    if (t.dataset.frk) { alternar(t.dataset.frk, t.dataset.frg, +t.dataset.fri); }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.matches && t.matches('input[data-folhafoto]')) { var fs = [].slice.call(t.files || []); t.value = ''; if (fs.length) abrirRevisao(fs); return; }
    if (!REV) return;
    if (t.dataset && t.dataset.frvis) { REV.sel[t.dataset.frvis].visit = t.checked; return; }
    if (t.dataset && t.dataset.frnota) { var a = t.dataset.frnota.split('|'); REV.sel[a[0] + '|' + a[1]].notas[+a[2]].usar = t.checked; }
  });
  document.addEventListener('input', function (ev) {
    var t = ev.target; if (!REV || !t.dataset || !t.dataset.frtx) return;
    var a = t.dataset.frtx.split('|'); REV.sel[a[0] + '|' + a[1]].notas[+a[2]].txt = t.value;
  });
  window.addEventListener('afterprint', function () { var c = document.getElementById('folhaPrint'); if (c) c.innerHTML = ''; });
  return { imprimir: imprimir, montar: montar, guardar: guardar, ler: lerArquivo, abrirRevisao: abrirRevisao, G: G, _codigo: codigo, _decodificar: decodificar, CENTROS: CENTROS, COD: COD };
})();

// ===================== init =====================
aplicarTema();
if (S.pacientes.length) recalc();
render();
if (!window.__estadoPronto) carregarIDB().then(function () { if (S.pacientes.length) recalc(); render(); });
// relê o internograma sozinho: versão nova da leitura, ou última leitura com mais de 20 min
setTimeout(function () {
  if (navigator.onLine && SYNC.temToken() && (S.parserV !== 4 || !S.igCache || Date.now() - S.igCache.em > 20 * 60000)) carregarDoc();
}, 1800);
document.addEventListener('visibilitychange', function () { if (!document.hidden && navigator.onLine && SYNC.temToken() && S.igCache && Date.now() - S.igCache.em > 20 * 60000) carregarDoc(); });

// confere a nuvem a cada 60 s enquanto o app está aberto (recebe o que outro aparelho fez, mesmo sem tocar em nada)
setInterval(function () {
  if (document.hidden || !navigator.onLine || !SYNC.temToken() || (typeof trancado === 'function' && trancado())) return;
  SYNC.agora();
}, 60000);
</script>
