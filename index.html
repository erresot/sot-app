<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOT — Visita + Evolução</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f6b5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f3f5f4; --card:#fff; --ink:#15211d; --mut:#5d6b66; --line:#dde3e0;
  --acc:#0f6b5c; --acc2:#e3f1ed; --warn:#b45309; --warn2:#fdf1e2; --bad:#b42318; --bad2:#fdeceb; --ok:#15803d; --ok2:#e7f6ec;
  --evo:#1f5fbf; --evo2:#e2ecfb;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.top h1{margin:0;font-size:17px;font-weight:650;letter-spacing:.2px}
.top .sub{display:flex;gap:10px;align-items:center;font-size:13px;opacity:.92;margin-top:4px;flex-wrap:wrap}
.top input[type=date]{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:3px 6px;font:inherit}
.prog{height:4px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:8px;overflow:hidden;position:relative}
.prog i{position:absolute;left:0;top:0;height:100%;background:#9ee6c9;width:0;transition:width .3s}
.prog i.e{background:#8fb8ff;height:50%;top:50%}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 84px);max-width:760px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:19px;line-height:1}
.tabs button.on{color:var(--acc);font-weight:600}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13.5px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:0 1px 0 rgba(0,0,0,.04);border:1px solid var(--line)}
.pt{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.leito{flex:none;width:58px;text-align:center;border-radius:10px;background:var(--acc2);color:var(--acc);font-weight:700;padding:8px 0;font-size:16px}
.leito small{display:block;font-weight:500;font-size:10.5px;opacity:.8}
.pt.done .leito{background:var(--ok2);color:var(--ok)}
.pt .nm{font-weight:650}
.pt .dx{color:var(--mut);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11.5px;border-radius:6px;padding:1px 6px;background:#eef1f0;color:#33413c}
.tag.po{background:var(--acc2);color:var(--acc);font-weight:600}
.tag.hj{background:var(--warn2);color:var(--warn);font-weight:600}
.tag.ok{background:var(--ok2);color:var(--ok);font-weight:600}
.tag.evo{background:var(--evo2);color:var(--evo);font-weight:600}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--acc);color:#fff;font-weight:600;width:100%}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc)}
.btn.evo{background:var(--evo);color:#fff}
.btn.evos{background:#fff;color:var(--evo);border:1px solid var(--evo)}
.btn.ghost{background:none;color:var(--mut);border:1px dashed var(--line)}
.btn.sm{padding:7px 10px;font-size:13.5px;width:auto;border-radius:9px}
.row{display:flex;gap:8px}
.row>*{flex:1}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:16px 2px 8px;font-weight:650}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .22s ease;-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.sh-top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 10px;display:flex;gap:10px;align-items:center}
.sh-top .back{border:0;background:var(--acc2);color:var(--acc);border-radius:10px;width:38px;height:38px;font-size:20px;flex:none}
.sh-top .t{flex:1;min-width:0}
.sh-top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-top .t span{font-size:12.5px;color:var(--mut)}
.sh-body{padding:12px 12px calc(env(safe-area-inset-bottom) + 96px);max-width:760px;margin:0 auto}
details.ig{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.ig summary{padding:11px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;cursor:pointer}
details.ig summary::after{content:"▾";color:var(--mut)}
details.ig[open] summary::after{content:"▴"}
.ig .in{padding:0 12px 12px;font-size:13.5px}
.ig .in p{margin:0 0 6px}
.ig .in b{color:var(--acc)}
.q{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.q .lb{font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.q.evoq{border-color:var(--evo);background:linear-gradient(var(--evo2),#fff 60px)}
.q.evoq .lb{color:var(--evo)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.op{border:1px solid var(--line);background:#fafbfa;border-radius:10px;padding:8px 11px;font-size:14px;min-height:38px}
.op.on{background:var(--acc);border-color:var(--acc);color:#fff}
.op.on.alert{background:var(--bad);border-color:var(--bad)}
.eva{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.eva .op{padding:8px 0;text-align:center;min-height:36px}
.num{display:flex;gap:8px;align-items:center;margin-top:6px}
.num input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;background:#fafbfa}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:#fafbfa;resize:vertical}
textarea.mono{font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:140px}
.hint{font-size:12px;color:var(--mut);margin-top:5px}
.pend{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.pend:first-child{border-top:0}
.pend input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--acc)}
.pend .tx{flex:1;font-size:14px}
.pend.ok .tx{text-decoration:line-through;color:var(--mut)}
.pend .who{font-size:12px;color:var(--acc);font-weight:600;cursor:pointer}
.pend .x{border:0;background:none;color:var(--mut);font-size:18px;padding:0 4px}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
.add button{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:0 14px;font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:3;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px}
.out{white-space:pre-wrap;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:#fafbfa;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;max-height:260px;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:#15211d;color:#fff;padding:9px 14px;border-radius:10px;font-size:13.5px;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
.modal.on{display:flex}
.modal .box{background:#fff;width:100%;max-width:760px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px)}
.modal input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;margin-bottom:8px}
.drop{border:2px dashed #b9c7c2;border-radius:var(--r);padding:22px 14px;text-align:center;background:#fff}
.drop b{display:block;font-size:16px;margin-bottom:4px}
.lock{font-size:12px;color:var(--mut);text-align:center;margin-top:10px}
.agenda .when{font-weight:700;font-size:12px;color:var(--warn);min-width:56px}
/* evolução (tela cheia com o atualizador) */
#evoSheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease}
#evoSheet.open{transform:none}
#evoSheet .sh-top .back{background:var(--evo2);color:var(--evo)}
#evoSheet iframe{flex:1;border:0;width:100%;background:#f6f7f9}
.flow{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin:2px 2px 10px;flex-wrap:wrap}
.flow span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.flow span.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.flow span.done{border-color:var(--ok);color:var(--ok)}
.evrow{display:flex;gap:10px;align-items:center}
.evrow .st{flex:1;min-width:0}
.evrow .st b{display:block}
.evrow .st span{font-size:12.5px;color:var(--mut)}
.tag.ic{background:#ece8fb;color:#5b3fc4;font-weight:600}
.tag.red{background:var(--bad2);color:var(--bad);font-weight:700}
.tag.warn{background:var(--warn2);color:var(--warn)}
.flagbox{background:var(--warn2);border:1px solid #f2c48d;color:#7a3e00;border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}
.q.redq{border-color:#f3b8b3}
.q.redq .lb{color:var(--bad)}
details.ng{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
details.ng summary{font-weight:600;font-size:13.5px;cursor:pointer}
.ngrid{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ngh,.ngr{display:grid;grid-template-columns:minmax(0,1fr) 54px 54px 50px 50px;gap:4px;align-items:center;font-size:12.5px}
.ngh{color:var(--mut);font-size:11px;text-align:center}
.ngr select,.lppi select{font:inherit;font-size:13px;padding:6px 2px;border:1px solid var(--line);border-radius:8px;background:#fafbfa;width:100%}
.ngr select.set{border-color:var(--acc);background:var(--acc2);font-weight:700}
.ngr select.pior{border-color:var(--bad);background:var(--bad2);font-weight:700;color:var(--bad)}
.lppi{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}
.sync{display:block;width:100%;text-align:left;margin-top:6px;border:0;border-radius:8px;padding:5px 8px;font-size:12px;background:rgba(255,255,255,.14);color:#fff}
.sync.off{background:#7a4b00}.sync.erro{background:#8a1c13}.sync.login{background:#3b3f8a}.sync.ok{background:rgba(255,255,255,.14)}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:8px}
.fotos figure{margin:0;position:relative;border-radius:8px;overflow:hidden;background:#e9eeec;aspect-ratio:1}
.fotos img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.fotos figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 4px;line-height:1.25}
.fotos .st{position:absolute;top:3px;right:3px;font-size:11px;background:rgba(0,0,0,.55);color:#fff;border-radius:5px;padding:0 4px}
.camrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.camrow label.btn{width:auto;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
#viewer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column}
#viewer.on{display:flex}#viewer img{max-width:100%;max-height:85vh}#viewer div{color:#fff;font-size:13px;padding:8px;text-align:center}
</style>
</head>
<body>
<div class="top">
  <h1>SOT · Visita + Evolução</h1>
  <div class="sub"><input type="date" id="hoje"><span id="resumo">—</span></div>
  <div class="prog"><i id="progbar"></i><i class="e" id="progevo"></i></div>
  <button id="sync" class="sync local" data-sync>📱 só neste aparelho</button>
</div>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="leitos" class="on"><b>🛏</b>Leitos</button>
  <button data-tab="pend"><b>☑</b><span>Pendências <span id="npend"></span></span></button>
  <button data-tab="saida"><b>📝</b><span>Evoluções <span id="nevo"></span></span></button>
  <button data-tab="config"><b>⚙</b>Internograma</button>
</nav>

<div class="sheet" id="sheet"></div>
<div id="evoSheet" aria-hidden="true">
  <div class="sh-top">
    <button class="back" id="evoBack" title="Voltar sem salvar">‹</button>
    <div class="t"><b id="evoTit">Evolução</b><span id="evoSub">revise os campos e salve</span></div>
    <button class="btn evo sm" id="evoSave">Salvar ✓</button>
  </div>
  <iframe id="evoFrame" title="Atualizador de evolução" allow="clipboard-write"></iframe>
</div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div id="viewer" data-viewer><img id="viewerImg" alt=""><div id="viewerCap"></div></div>
<input type="file" id="file" accept="application/pdf" hidden>

<script src="sync.js"></script>
<script>
// ===== Parser do internograma (PDF exportado do Google Docs) =====
var COL_EDGES = [39, 142, 221, 356, 516, 669, 802];
var COLS = ['local', 'nome', 'causa', 'orienta', 'condutas', 'exames'];
// início de um paciente na coluna "Local": ala, sala, UTI, CC, PS, Hm, arquivo…
var RE_START = /^(ala|sala|uti|enf|enfermaria|apto|box|semi|cti|cc|centro|rpa|ps|pronto|hm|hd|arquivo|isolamento|leito)\b/i;
var RE_SECTION = /^(ala\s*[a-z0-9]{1,2}|sala amarela\s*\/\s*vermelha|uti\s*[a-z0-9]?|mi|cc|centro cir[uú]rgico|rpa|hm|altas?|arquivo|interconsultas?|pronto[- ]socorro|ps|possível internação.*|possivel internação.*|enfermaria.*|semi.*)$/i;
function colOf(xc, pw) { var s = pw / 842; for (var i = 0; i < 6; i++) if (xc < COL_EDGES[i + 1] * s) return i; return 5; }
function parseInternograma(pages) {
  var rows = [], dataInternograma = null, cab = null, leitosPDF = [];
  pages.forEach(function (pg, pi) {
    var its = pg.items.filter(function (i) { return i.str && i.str.trim(); }).sort(function (a, b) { return a.top - b.top || a.x - b.x; });
    var cur = null;
    its.forEach(function (it) { if (!cur || Math.abs(it.top - cur.top) > 3) { cur = { page: pi, top: it.top, parts: [] }; rows.push(cur); } cur.parts.push(it); });
  });
  rows.forEach(function (r) {
    r.cells = [[], [], [], [], [], []];
    r.parts.sort(function (a, b) { return a.x - b.x; });
    r.parts.forEach(function (it) {
      var pw = pages[r.page].width, c = colOf(it.x + (it.w || 0) / 2, pw);
      if ((it.w || 0) > 120 * pw / 842) c = colOf(it.x + 5, pw);
      r.cells[c].push(it.str.replace(/\s+/g, ' ').trim());
    });
    r.text = r.parts.map(function (p) { return p.str.trim(); }).join(' ').trim();
    r.cells[0].forEach(function (t) { if (/^\d{4}[a-z]?$/i.test(t.trim())) leitosPDF.push(t.trim()); });
  });
  var pacientes = [], cur = null, section = '', soltas = [];
  rows.forEach(function (r) {
    var m = r.text.match(/^\(?(\d{1,2}\/\d{1,2}\/\d{2,4})\s*-\s*(\d+)\s*hc\s*\/\s*(\d+)\s*ic\s*\/\s*(\d+)\s*hm\s*\/\s*(\d+)\s*alta/i);
    if (m) { dataInternograma = m[1]; cab = { hc: +m[2], ic: +m[3], hm: +m[4], alta: +m[5] }; return; }
    m = r.text.match(/^\(?(\d{1,2}\/\d{1,2}\/\d{2,4})\s*-\s*\d+\s*hc/i);
    if (m) { dataInternograma = m[1]; return; }
    if (/^Local\b.*\bNome\b/i.test(r.text) || /^(Mecanismo|Dih Origem|Leito Interna|Registro)\b/i.test(r.text)) return;
    var nonEmpty = r.cells.filter(function (c) { return c.length; }).length;
    var pw0 = pages[r.page].width, x0 = r.parts[0].x / pw0 * 842;
    if (nonEmpty === 1 && !r.cells[0].length && r.parts.length <= 4 && x0 > 300 && x0 < 520 && RE_SECTION.test(r.text.trim())) {
      // título de seção sozinho na linha (centralizado ou na coluna Local)
      cur = null; section = r.text.replace(/\s+/g, ' ').trim(); return;
    }
    var local0 = r.cells[0].join(' ');
    if (RE_START.test(local0) && r.cells[1].length && (!cur || cur.cols.local.length > 1 || cur.cols.nome.length)) {
      cur = { section: section, cols: {} }; COLS.forEach(function (k) { cur.cols[k] = []; }); pacientes.push(cur);
    } else if (RE_START.test(local0) && !cur) {
      cur = { section: section, cols: {} }; COLS.forEach(function (k) { cur.cols[k] = []; }); pacientes.push(cur);
    }
    if (!cur) { if (r.cells[1].length || r.cells[2].length) soltas.push({ section: section, texto: r.text.slice(0, 120) }); return; }
    COLS.forEach(function (k, i) { if (r.cells[i].length) cur.cols[k].push({ t: r.cells[i].join(' '), top: r.top + r.page * 10000 }); });
  });
  return { data: dataInternograma, cab: cab, soltas: soltas, leitosPDF: leitosPDF, pacientes: pacientes.map(extrairCampos).filter(function (p) { return p.nome; }) };
}

// ===== leitura direta do Google Doc (exportado em HTML: 1 linha da tabela = 1 paciente) =====
function parseTabelaHTML(html) {
  var doc = new DOMParser().parseFromString(html, 'text/html');
  var cab = null, data = null;
  var txt = doc.body ? doc.body.textContent : '';
  var m = txt.match(/\((\d{1,2}\/\d{1,2}\/\d{2,4})\s*-\s*(\d+)\s*hc\s*\/\s*(\d+)\s*ic\s*\/\s*(\d+)\s*hm\s*\/\s*(\d+)\s*alta/i);
  if (m) { data = m[1]; cab = { hc: +m[2], ic: +m[3], hm: +m[4], alta: +m[5] }; }
  var tab = Array.prototype.slice.call(doc.querySelectorAll('table')).sort(function (a, b) { return b.rows.length - a.rows.length; })[0];
  if (!tab) return { data: data, cab: cab, soltas: [], leitosPDF: [], pacientes: [] };
  var section = '', pacientes = [], soltas = [], top = 0;
  function linhasCel(td) {
    var ps = td.querySelectorAll('p'), out = [];
    (ps.length ? Array.prototype.slice.call(ps) : [td]).forEach(function (p) { var t = (p.textContent || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim(); if (t) out.push(t); });
    return out;
  }
  Array.prototype.slice.call(tab.rows).forEach(function (tr, ri) {
    var tds = Array.prototype.slice.call(tr.cells);
    var cels = tds.map(linhasCel);
    var cheio = cels.filter(function (c) { return c.length; }).length;
    if (!cheio) return;
    if (tds.length === 1 || cheio === 1 && cels[0].length === 1 && tds.length < 6) { section = cels.map(function (c) { return c.join(' '); }).join(' ').trim(); return; }
    if (/^local\b/i.test((cels[0][0] || '')) && /^nome\b/i.test((cels[1] && cels[1][0]) || '')) return;
    if (!(cels[1] || []).length) { soltas.push({ section: section, texto: cels.map(function (c) { return c.join(' / '); }).join(' | ').slice(0, 120) }); return; }
    var p = { section: section, cols: {} };

function grausOntem(id) {

    for (var lv in MYO_RE) if (MYO_RE[lv].test(l)) {

function importarPDF(f) {

  try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) {}
  f.arrayBuffer().then(function (buf) { return pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise; }).then(function (doc) {
    var ps = [];
    for (var i = 1; i <= doc.numPages; i++) ps.push(doc.getPage(i).then(function (pg) {
      var vp = pg.getViewport({ scale: 1 });
      return pg.getTextContent().then(function (tc) { return { width: vp.width, height: vp.height, items: tc.items.map(function (it) { return { str: it.str, x: it.transform[4], top: vp.height - it.transform[5], w: it.width }; }) }; });
    }));
    return Promise.all(ps);
  }).then(function (pages) {
    var r = parseInternograma(pages);
    if (!r.pacientes.length) { toast('Não reconheci pacientes neste PDF'); return; }
    aplicarImport(r, f.name);

}
function classificar(p) {

  p.ic = /interconsult/i.test(sec) || /interconsult/i.test(tudo);
  p.ps = /possível internação|possivel internacao|pronto|^ps\b|sala amarela|sala vermelha/i.test(sec + ' ' + loc) || /est[aá] no ps|no pronto/i.test(tudo);
  var lugar = loc.replace(/\s+/g, ' ').replace(/^(\w+)\s*(\w?)$/, function (m, a, b) { return cap(a) + (b ? ' ' + b.toUpperCase() : ''); }) || sec || '—';

function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase(); }
function contagem() {

function copiar(txt) {
  var ok = function () { toast('Copiado'); };
  try { navigator.clipboard.writeText(txt).then(ok, fallback); } catch (e) { fallback(); }
  function fallback() { var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = 0; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Selecione e copie manualmente'); } ta.remove(); }
}

function recalc() {
