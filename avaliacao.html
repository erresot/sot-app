<!doctype html>
<html lang="pt-BR">
<head><script>/* SOT: esta página só abre depois da senha do app */(function(){var ok=false;try{ok=sessionStorage.getItem('sot-ok')==='1'&&Date.now()-(+localStorage.getItem('sot-ult')||0)<15*60000;}catch(e){}if(window.top===window&&!ok){location.replace(new URL('../index.html',location.href).href);return;}var u=0;function m(){var n=Date.now();if(n-u>20000){u=n;try{localStorage.setItem('sot-ult',String(n));}catch(e){}}}['pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,m,{capture:true,passive:true});});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Solicitador de Avaliações · SOT</title>
<style>
:root{--bg:#f3f2ee;--card:#fff;--ink:#172026;--mut:#5f6b70;--line:#d9dcd8;--acc:#0f6e6e;--acc2:#e4efed;--warn:#9a5b00}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2321;--ink:#e6ecea;--mut:#9aa7a4;--line:#2d3936;--acc:#3fb3a8;--acc2:#1f3532;--warn:#f0b450}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 40px}
h1{margin:0 0 4px;font-size:22px}
.sub{margin:0 0 16px;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:46px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input{flex:1;min-width:120px}
.out{white-space:pre-wrap;font:14px/1.6 ui-monospace,"IBM Plex Mono",Menlo,monospace;background:var(--acc2);border-radius:10px;padding:12px}
button.copy{width:100%;padding:15px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:700 17px/1 inherit;cursor:pointer;margin-top:12px}
.ck{display:flex;gap:8px;align-items:center;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;margin:0}
.ck input{width:20px;height:20px}
.hint{font-size:12.5px;color:var(--mut);margin:6px 0 0}
.ok{color:var(--acc);font-weight:700;text-align:center;margin-top:8px;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Solicitador de Avaliações</h1>
  <p class="sub">Monta o pedido de avaliação no padrão do serviço. Para paciente internado, use o botão “📝 Solicitar avaliação” na ficha do paciente (já vem preenchido pelo internograma e pela evolução).</p>

  <div class="card">
    <label>Avaliação</label>
    <div class="chips" id="tipos"></div>
    <input id="tipo" value="ANESTÉSICA" style="margin-top:8px" aria-label="Tipo de avaliação">
  </div>

  <div class="card">
    <label for="nome">Paciente</label><input id="nome" autocomplete="off">
    <div class="row">
      <div style="flex:1;min-width:110px"><label for="idade">Idade</label><input id="idade" inputmode="numeric" autocomplete="off"></div>
      <div style="flex:2;min-width:150px"><label for="registro">Registro</label><input id="registro" inputmode="numeric" autocomplete="off"></div>
    </div>
    <label for="cmb">CMB</label><textarea id="cmb"></textarea>
    <label for="muc">MUC</label><textarea id="muc"></textarea>
    <label for="alergia">Alergias</label><textarea id="alergia"></textarea>
    <label for="hd">HD</label><textarea id="hd"></textarea>
    <label for="proc">Programação</label><input id="proc" placeholder="Procedimento (ex.: osteossíntese de fêmur proximal)">
    <div class="row" style="margin-top:8px"><input type="date" id="data" style="max-width:200px"><label class="ck"><input type="checkbox" id="adef" checked> em data a definir</label></div>
  </div>

  <div class="card">
    <label>Texto</label>
    <div class="out" id="out"></div>
    <button class="copy" id="copy" type="button">Copiar texto</button>
    <div class="ok" id="ok"></div>
    <button class="chip" id="limpar" type="button" style="width:100%;margin-top:6px">Limpar para outro paciente</button>
  </div>
</div>
<script>
var $ = function (id) { return document.getElementById(id); };
var TIPOS = ['ANESTÉSICA', 'CARDIOLÓGICA', 'ANESTÉSICA E CARDIOLÓGICA'];
var CAMPOS = ['tipo', 'nome', 'idade', 'registro', 'cmb', 'muc', 'alergia', 'hd', 'proc', 'data'];
function U(s) { return String(s || '').toUpperCase().trim(); }
function texto() {
  var idade = U($('idade').value);
  var quando = $('adef').checked || !$('data').value ? 'EM DATA A DEFINIR' : 'DIA ' + $('data').value.split('-').reverse().join('/');
  return 'SOLICITO AVALIAÇÃO ' + U($('tipo').value) + '\n' +
    'PACIENTE: ' + U($('nome').value) + '\nIDADE: ' + idade + (/^\d+$/.test(idade) ? ' ANOS' : '') + '\nREGISTRO: ' + U($('registro').value) + '\n\n' +
    'CMB: ' + U($('cmb').value) + '\nMUC: ' + U($('muc').value) + '\nALERGIAS: ' + U($('alergia').value) + '\n\n' +
    'HD: ' + U($('hd').value) + '\n\n' +
    'PROGRAMAÇÃO: ' + (U($('proc').value) ? U($('proc').value) + ' ' : '') + quando + '\n\nGRATO';
}
function desenhar() {
  $('tipos').innerHTML = TIPOS.map(function (t) { return '<button type="button" class="chip' + (U($('tipo').value) === t ? ' on' : '') + '" data-t="' + t + '">' + t.charAt(0) + t.slice(1).toLowerCase() + '</button>'; }).join('');
  $('data').disabled = $('adef').checked;
  $('out').textContent = texto();
}
$('tipos').addEventListener('click', function (e) { var b = e.target.closest('[data-t]'); if (b) { $('tipo').value = b.dataset.t; desenhar(); } });
document.addEventListener('input', desenhar);
$('adef').addEventListener('change', desenhar);
$('data').addEventListener('change', function () { if ($('data').value) $('adef').checked = false; desenhar(); });
$('copy').onclick = function () {
  var t = texto(), ok = function () { $('ok').textContent = '✓ Copiado'; setTimeout(function () { $('ok').textContent = ''; }, 2500); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, function () { fallback(t); ok(); });
  else { fallback(t); ok(); }
};
function fallback(t) { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); }
$('limpar').onclick = function () { CAMPOS.forEach(function (k) { if (k !== 'tipo') $(k).value = ''; }); $('adef').checked = true; desenhar(); $('nome').focus(); };
desenhar();
</script>
</body>
</html>
